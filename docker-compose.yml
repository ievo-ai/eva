# Eva — local Docker Compose
#
# Quick start:
#   cp .env.example .env            # fill in tokens
#   git clone https://github.com/ievo-ai/marketplace ../marketplace
#
# Commands:
#   docker compose run --rm eva-scan       # dry-run (safe, no PRs)
#   docker compose run --rm eva-live       # live mode (creates PRs + publishes evolutions)
#   docker compose run --rm eva-status     # show status & source health
#
# Env vars (.env):
#   EVA_GITHUB_TOKEN  — GitHub PAT or App token (required)
#   EVA_SENTRY_TOKEN  — Sentry auth token for reading issues (optional)
#   EVA_SENTRY_DSN    — Sentry DSN for Eva's own error reporting (optional)
#   MARKETPLACE_DIR   — path to marketplace repo (default: ../marketplace)

services:
  # ── Dry-run scan (safe, no PRs) ────────────────────────
  eva-scan:
    build: .
    container_name: eva-scan
    env_file: .env
    volumes:
      - ./eva.yaml:/app/eva.yaml:ro
      - ./output:/app/output
      - ${MARKETPLACE_DIR:-../marketplace}:/app/marketplace:ro
    command:
      - scan
      - --config=/app/eva.yaml
      - --marketplace=/app/marketplace
      - --report=/app/output/eva-report.json

  # ── Live mode (creates PRs + publishes evolutions) ─────
  eva-live:
    build: .
    container_name: eva-live
    env_file: .env
    volumes:
      - ./eva.yaml:/app/eva.yaml:ro
      - ./output:/app/output
      - ${MARKETPLACE_DIR:-../marketplace}:/app/marketplace:ro
    command:
      - scan
      - --config=/app/eva.yaml
      - --marketplace=/app/marketplace
      - --report=/app/output/eva-report.json
      - --live

  # ── Status check ───────────────────────────────────────
  eva-status:
    build: .
    container_name: eva-status
    env_file: .env
    volumes:
      - ./eva.yaml:/app/eva.yaml:ro
    command:
      - status
      - --config=/app/eva.yaml

  # ── Scheduled scan (cron-like loop, opt-in) ────────────
