# Eva — local Docker Compose
#
# Quick start:
#   cp .env.example .env            # fill in tokens
#   git clone https://github.com/ievo-ai/marketplace ../marketplace
#
# Commands:
#   docker compose run --rm eva-scan       # dry-run (safe, no PRs)
#   docker compose run --rm eva-live       # live mode (creates PRs + publishes evolutions)
#   docker compose run --rm eva-status     # show status & source health
#
# Env vars (.env):
#   EVA_PAT_GITHUB_TOKEN     — GitHub PAT from ievo-eva account (required)
#   EVA_SENTRY_TOKEN         — Sentry auth token for reading issues (optional)
#   EVA_SENTRY_DSN           — Sentry DSN for Eva's own error reporting (optional)
#   MARKETPLACE_DIR          — path to marketplace repo (default: ../marketplace)
#   TELEGRAM_BOT_TOKEN       — Telegram bot token for community interaction
#   TELEGRAM_COMMUNITY_CHAT  — Telegram chat ID for publishing + interaction
#   ANTHROPIC_API_KEY        — Anthropic API key for Eva's community responses

services:
  # ── Dry-run scan (safe, no PRs) ────────────────────────
  eva-scan:
    build: .
    container_name: eva-scan
    env_file: .env
    volumes:
      - ./eva.yaml:/app/eva.yaml:ro
      - ./output:/app/output
      - ${MARKETPLACE_DIR:-../marketplace}:/app/marketplace:ro
    command:
      - scan
      - --config=/app/eva.yaml
      - --marketplace=/app/marketplace
      - --report=/app/output/eva-report.json

  # ── Live mode (creates PRs + publishes evolutions) ─────
  eva-live:
    build: .
    container_name: eva-live
    env_file: .env
    volumes:
      - ./eva.yaml:/app/eva.yaml:ro
      - ./output:/app/output
      - ${MARKETPLACE_DIR:-../marketplace}:/app/marketplace:ro
    command:
      - scan
      - --config=/app/eva.yaml
      - --marketplace=/app/marketplace
      - --report=/app/output/eva-report.json
      - --live

  # ── Status check ───────────────────────────────────────
  eva-status:
    build: .
    container_name: eva-status
    env_file: .env
    volumes:
      - ./eva.yaml:/app/eva.yaml:ro
    command:
      - status
      - --config=/app/eva.yaml

  # ── Telegram community processing (one-shot, local testing) ──
  eva-tg:
    build: .
    container_name: eva-tg
    env_file: .env
    volumes:
      - ./eva.yaml:/app/eva.yaml:ro
      - ./agent:/app/agent:ro
      - ./output:/app/output
    command:
      - tg-process
      - --limit=50

  # ── Telegram daemon (continuous, for DO deployment) ──────
  eva-tg-daemon:
    build: .
    container_name: eva-tg-daemon
    restart: unless-stopped
    env_file: .env
    environment:
      - GH_TOKEN=${EVA_PAT_GITHUB_TOKEN}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          echo "=== Eva TG process: $$(date) ==="
          eva tg-process --limit 50 || true
          echo "=== Sleeping 10s ==="
          sleep 10
        done
    volumes:
      - ./eva.yaml:/app/eva.yaml:ro
      - ./agent:/app/agent:ro
      - ./output:/app/output
      - claude-data:/root/.claude

  # ── Scheduled scan (cron-like loop, opt-in) ────────────
  # Uncomment to run Eva on a 6-hour loop.
  # eva-cron:
  #   build: .
  #   container_name: eva-cron
  #   restart: unless-stopped
  #   env_file: .env
  #   entrypoint: ["/bin/sh", "-c"]
  #   command:
  #     - |
  #       while true; do
  #         echo "=== Eva scan: $$(date) ==="
  #         eva scan --config=/app/eva.yaml --marketplace=/app/marketplace --report=/app/output/eva-report.json
  #         echo "=== Sleeping 6h ==="
  #         sleep 21600
  #       done
  #   volumes:
  #     - ./eva.yaml:/app/eva.yaml:ro
  #     - ./output:/app/output
  #     - ${MARKETPLACE_DIR:-../marketplace}:/app/marketplace:ro

volumes:
  claude-data:
