[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ievo-eva"
version = "0.1.0"
description = "Eva — meta-evolution Mother agent for iEvo platform"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "iEvo", email = "hello@ievo.ai" }]
dependencies = [
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "click>=8.1.0",
    "jinja2>=3.1.0",
    "gitpython>=3.1.50",
    "sentry-sdk>=2.0",
]

[project.scripts]
eva = "eva.cli:main"

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "pytest-asyncio>=0.24", "pytest-cov>=6.0", "ruff>=0.8.0", "mypy>=1.14"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8.0",
    "mypy>=1.14",
    "types-pyyaml>=6.0.12.20250915",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/eva"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["F", "E", "I", "UP", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"__future__.annotations".msg = "Python 3.13+ — use PEP 604/585 natively, no __future__ needed"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.ruff.lint.pyupgrade]
# Forbid from __future__ import annotations (Python 3.13+ doesn't need it)
keep-runtime-typing = true

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
exclude = ["tests/", "scripts/"]

[[tool.mypy.overrides]]
module = ["sentry_sdk.*", "git.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["eva"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
