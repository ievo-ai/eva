[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ievo-eva"
version = "0.1.0"
description = "Eva — meta-evolution Mother agent for iEvo platform"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "iEvo", email = "hello@ievo.ai" }]
dependencies = [
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "click>=8.1.0",
    "jinja2>=3.1.0",
    "gitpython>=3.1.0",
    "sentry-sdk>=2.0",
]

[project.scripts]
eva = "eva.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.8.0"]

[tool.uv]
python = ">=3.13"
dev-dependencies = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/eva"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
