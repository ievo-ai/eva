# Eva configuration
# Docs: https://github.com/ievo-ai/eva

repos:
  cli: ievo-ai/cli
  marketplace: ievo-ai/marketplace
  sdk: ievo-ai/sdk
  eva: ievo-ai/eva
  landing: ievo-ai/ievo.ai

sources:
  sentry:
    enabled: true
    extra:
      org: ievo
      projects:
        cli: cli
        sdk: sdk
        eva: eva
  github_issues:
    enabled: true
  reviews:
    enabled: false
  evolution_logs:
    enabled: true

# Safety
dry_run: true
max_mutations_per_run: 5
auto_merge: false
