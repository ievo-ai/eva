site_name: iEvo Documentation
site_url: https://ievo-ai.github.io/eva/
site_description: Self-Evolving AI Agent Framework — documentation for the iEvo platform
repo_url: https://github.com/ievo-ai/eva
repo_name: ievo-ai/eva

theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - search.suggest
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Platform:
      - Global Architecture: global-architecture.md
      - Agent Pipeline: pipeline.md
  - Eva:
      - Architecture: architecture.md
      - Sources: sources.md
      - Configuration: configuration.md
      - Deployment: deployment.md
      - Safety: safety.md
      - GitHub App Setup: GITHUB_APP_SETUP.md
  - Research:
      - Competitive Analysis: research/competitive-analysis.md
      - Roadmap: research/roadmap.md
  - Ecosystem:
      - CLI: ecosystem/cli.md
      - Marketplace: ecosystem/marketplace.md
      - SDK: ecosystem/sdk.md
      - Curator: ecosystem/curator.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - tables
  - toc:
      permalink: true

plugins:
  - search
