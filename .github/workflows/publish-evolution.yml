name: Publish Evolution

# Triggered after Eva merges a PR or after a mutation is applied.
# Uses `eva publish --live` to push to ievo.ai + Telegram.
on:
  workflow_dispatch:
    inputs:
      title:
        description: 'Short title of the evolution'
        required: true
      type:
        description: 'Evolution type (role_patch, skill_patch, memory_update, config_patch, milestone, best_practice)'
        default: 'milestone'
      agent:
        description: 'Agent that made the mutation'
        default: 'eva'
      target:
        description: 'Target file or repo'
        default: ''
      description:
        description: 'Description of the evolution'
        default: ''
      confidence:
        description: 'Confidence score (0.0-1.0)'
        default: '1.0'
      pr_url:
        description: 'PR URL'
        default: ''

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Eva
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Eva
        run: pip install -e .

      - name: Publish evolution
        env:
          EVA_GITHUB_TOKEN: ${{ secrets.EVA_PAT_GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_COMMUNITY_CHAT: ${{ secrets.TELEGRAM_COMMUNITY_CHAT }}
          EVO_TITLE: ${{ inputs.title }}
          EVO_TYPE: ${{ inputs.type }}
          EVO_AGENT: ${{ inputs.agent }}
          EVO_TARGET: ${{ inputs.target }}
          EVO_DESC: ${{ inputs.description }}
          EVO_CONFIDENCE: ${{ inputs.confidence }}
          EVO_PR: ${{ inputs.pr_url }}
        run: |
          eva publish \
            --title "$EVO_TITLE" \
            --type "$EVO_TYPE" \
            --agent "$EVO_AGENT" \
            --target "$EVO_TARGET" \
            --description "$EVO_DESC" \
            --confidence "$EVO_CONFIDENCE" \
            --pr "$EVO_PR" \
            --live
