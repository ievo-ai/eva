name: Publish Evolution

# Triggered after Eva merges a PR or after a mutation is applied.
# Uses `eva publish --live` to push to ievo.ai + Telegram.
on:
  workflow_dispatch:
    inputs:
      title:
        description: 'Short title of the evolution'
        required: true
      type:
        description: 'Evolution type (role_patch, skill_patch, memory_update, config_patch, milestone, best_practice)'
        default: 'milestone'
      agent:
        description: 'Agent that made the mutation'
        default: 'eva'
      target:
        description: 'Target file or repo'
        default: ''
      description:
        description: 'Description of the evolution'
        default: ''
      confidence:
        description: 'Confidence score (0.0-1.0)'
        default: '1.0'
      pr_url:
        description: 'PR URL'
        default: ''

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    # DISABLED 2026-05-20 — Telegram publish is paused at this choke point so
    # NO trigger path (workflow_dispatch from anyone, workflow_run, future
    # workflows) can ping the channel. PR #23 disabled the *caller* side
    # (eva-review-pr.yml), but workflow_run loads workflows from the default
    # branch — so the OLD eva-review-pr.yml on `main` still ran on PR #23
    # itself and fired Telegram 12s after PR #23 merged. Lesson: when killing
    # a side-effect that runs from automation, kill it at the runner side,
    # not at the dispatch side.
    #
    # When the proper post-merge replacement workflow lands (sketch in
    # eva-review-pr.yml's commented "Publish evolution" block), flip this
    # guard to `if: github.event.pull_request.merged == true` (or whatever
    # condition the replacement triggers on) and the publish path is live
    # again. The steps below remain intact so flipping is a one-line change.
    if: false

    steps:
      - name: Checkout Eva
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Eva
        run: pip install -e .

      - name: Publish evolution
        env:
          EVA_GITHUB_TOKEN: ${{ secrets.EVA_PAT_GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_COMMUNITY_CHAT: ${{ secrets.TELEGRAM_COMMUNITY_CHAT }}
          TELEGRAM_EVOLUTIONS_TOPIC: ${{ secrets.TELEGRAM_EVOLUTIONS_TOPIC }}
          EVO_TITLE: ${{ inputs.title }}
          EVO_TYPE: ${{ inputs.type }}
          EVO_AGENT: ${{ inputs.agent }}
          EVO_TARGET: ${{ inputs.target }}
          EVO_DESC: ${{ inputs.description }}
          EVO_CONFIDENCE: ${{ inputs.confidence }}
          EVO_PR: ${{ inputs.pr_url }}
        run: |
          eva publish \
            --title "$EVO_TITLE" \
            --type "$EVO_TYPE" \
            --agent "$EVO_AGENT" \
            --target "$EVO_TARGET" \
            --description "$EVO_DESC" \
            --confidence "$EVO_CONFIDENCE" \
            --pr "$EVO_PR" \
            --live
