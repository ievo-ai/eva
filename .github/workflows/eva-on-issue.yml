            ## Safety reminders (non-negotiable)
              - NEVER close the issue, open PRs, or modify files. The router only analyzes + labels; implementation is a separate gated step (consumes the `approved` label).
              - NEVER apply `accepted` / `rejected` / `priority/*`
                labels. Operator-only decisions.
              - NEVER open linked PRs. Surface in comment; eva-research
                will pick up implementation OR operator opens manually.
              - If you can't classify confidently (vague issue, "help"
                title), post a comment asking for clarification rather
                than guessing. No label is fine.
              - `github-actions[bot]` and any bot OTHER than Eva's own
                App are filtered by the job `if:` (self-check anyway).
                Issues authored by Eva's OWN App (`app/ievo-eva`) are
                NOT skipped — they are handled by Step 0 → Skeptic mode
                (adversarial reject/hold/self-approve, eva#132), which
                deliberately comments/labels/closes/approves.
              - In Skeptic mode, DEFAULT to reject and never self-approve
                outside SAFE_PATHS, over the daily cap, on a terminal-
                labeled issue, or on `ievo-ai/eva` itself.
              - Per `CLAUDE.md` "Verify documentation before changing
                or asserting tool/library behavior": if the issue
                claims a tool/library does X, verify via Context7 or
                official docs before agreeing/disagreeing in the
                comment.
              - Per `agent/ROLE.md` Safety Rule #10 (Symmetric
