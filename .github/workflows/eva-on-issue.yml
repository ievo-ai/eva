# Eva — triggered by new issues across iEvo repos
# Listens via repository_dispatch from other repos,
# or directly on issues in the Eva repo itself.

name: Eva on Issue

on:
  # Direct: issue opened in this repo
  issues:
    types: [opened, labeled]

  # Cross-repo: dispatched from other iEvo repos
  # Other repos send: gh api repos/ievo-ai/eva/dispatches -f event_type=new-issue ...
  repository_dispatch:
    types: [new-issue]

permissions:
  contents: read
  issues: read

jobs:
  react:
    name: "Eva: React to issue"
    runs-on: ubuntu-latest

    # Skip bot-created issues to prevent loops
    if: >
      github.event_name == 'repository_dispatch' ||
      (github.event_name == 'issues' && github.event.issue.user.login != 'github-actions[bot]')

    steps:
      - name: Checkout Eva
        uses: actions/checkout@v4

      - name: Checkout Marketplace
        uses: actions/checkout@v4
        with:
          repository: ievo-ai/marketplace
          path: marketplace

      # --- Auth: GitHub App or PAT ---
      - name: Generate App token
        if: ${{ vars.USE_GITHUB_APP == 'true' }}
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ievo-ai

      - name: Set GitHub token
        id: auth
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          PAT_TOKEN: ${{ secrets.EVA_GITHUB_TOKEN }}
        run: |
          if [ -n "$APP_TOKEN" ]; then
            echo "token=$APP_TOKEN" >> "$GITHUB_OUTPUT"
          else
            echo "token=$PAT_TOKEN" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Eva container
        run: docker build -t eva:local .

      - name: Prepare issue context
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_REPO: ${{ github.event.client_payload.repo }}
          DISPATCH_NUMBER: ${{ github.event.client_payload.issue_number }}
          CURRENT_REPO: ${{ github.repository }}
          ISSUE_NUM: ${{ github.event.issue.number }}
        run: |
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            echo "ISSUE_SOURCE=$DISPATCH_REPO" >> "$GITHUB_ENV"
            echo "ISSUE_NUMBER=$DISPATCH_NUMBER" >> "$GITHUB_ENV"
          else
            echo "ISSUE_SOURCE=$CURRENT_REPO" >> "$GITHUB_ENV"
            echo "ISSUE_NUMBER=$ISSUE_NUM" >> "$GITHUB_ENV"
          fi

      - name: Run Eva scan (dry-run)
        env:
          EVA_GITHUB_TOKEN: ${{ steps.auth.outputs.token }}
          WORKSPACE: ${{ github.workspace }}
        run: |
          echo "Eva triggered by issue #${ISSUE_NUMBER} in ${ISSUE_SOURCE}"
          docker run --rm \
            -e EVA_GITHUB_TOKEN \
            -v "$WORKSPACE/marketplace":/app/marketplace:ro \
            eva:local \
            scan --marketplace /app/marketplace
