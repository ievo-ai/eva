# Eva — Issue Router (Phase 1 of the issue-pipeline migration, eva#106)
#
# When a new issue opens in ievo-ai/eva (or any iEvo repo via
# repository_dispatch: new-issue), Claude (acting as Eva) does router-grade
# deep analysis and posts ONE structured comment (Understanding / Approach /
# Questions / Conflicts / Risks) carrying a routing verdict marker
# (<!-- ievo-verdict: implement|hold -->), then applies classification +
# lifecycle-state labels (triage / needs-discussion / approved).
#
# verdict = implement ONLY when requirements are clear AND the change is
# low-risk; otherwise hold (default). The `approved` label is the signal the
# implement step consumes in a later phase (eva#106 Phase 1b).
#
# Upgraded from the prior triage-only version (was "Eva: Issue Triage",
# godfather task #42). Replaces the skills v1 issue-pipeline router.
#
# Scope (THIS workflow — router only):
#   - POSTS a comment, applies classification + lifecycle labels
#   - Does NOT auto-resolve / auto-close / open PRs / modify files / implement
#
# Security note: untrusted issue title/body never reach `run:` blocks
# directly. The Claude action receives them via the issue API call
# (gh issue view) executed inside the agent's Bash subprocess, never
# via GHA template interpolation into shell.
#
# Tracked as godfather task #42.

name: "Eva: Issue Router"

on:
  issues:
    types: [opened]
  repository_dispatch:
    types: [new-issue]

permissions:
  contents: read
  issues: write
  pull-requests: read
  id-token: write

concurrency:
  group: eva-triage-${{ github.event.client_payload.repo || github.repository }}-${{ github.event.client_payload.issue_number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  triage:
    name: "Eva: Issue Router"
    runs-on: ubuntu-latest
    timeout-minutes: 8

    if: >
      (github.event_name == 'repository_dispatch' &&
       github.event.client_payload.triggered_by != 'ievo-eva' &&
       github.event.client_payload.triggered_by != 'github-actions[bot]') ||
      (github.event_name == 'issues' &&
       github.event.issue.user.login != 'ievo-eva' &&
       github.event.issue.user.login != 'github-actions[bot]')

    steps:
      - uses: actions/checkout@v4

      - name: Resolve issue context
        id: ctx
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_REPO: ${{ github.event.client_payload.repo }}
          DISPATCH_ISSUE: ${{ github.event.client_payload.issue_number }}
          ISSUE_NUMBER_FROM_EVENT: ${{ github.event.issue.number }}
        run: |
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            REPO="$DISPATCH_REPO"
            ISSUE_NUM="$DISPATCH_ISSUE"
          else
            REPO="${{ github.repository }}"
            ISSUE_NUM="$ISSUE_NUMBER_FROM_EVENT"
          fi

          if [ -z "$REPO" ] || [ -z "$ISSUE_NUM" ]; then
            echo "Missing repo or issue number, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "repo=$REPO"
            echo "issue_number=$ISSUE_NUM"
            echo "skip=false"
          } >> "$GITHUB_OUTPUT"

      - name: Run Triage agent
        if: steps.ctx.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          claude_args: |
            --model sonnet
            --allowedTools "Bash,Read,Glob,Grep"
          settings: |
            {
              "env": {
                "GH_TOKEN": "${{ secrets.EVA_PAT_GITHUB_TOKEN }}",
                "EVA_PAT_GITHUB_TOKEN": "${{ secrets.EVA_PAT_GITHUB_TOKEN }}",
                "TARGET_REPO": "${{ steps.ctx.outputs.repo }}",
                "TARGET_ISSUE": "${{ steps.ctx.outputs.issue_number }}"
              }
            }
          prompt: |
            You are Eva acting as Issue Router (deep analysis + routing verdict). A new issue opened
            in $TARGET_REPO #$TARGET_ISSUE. Post ONE structured analysis
            comment (carrying a routing verdict) + apply classification and
            lifecycle-state labels. Do NOT implement anything — the verdict
            decides whether a later gated step builds.

            ## Step 1 — Load context (terse — stop when you have enough)

            Read in order:
              - agent/ROLE.md (you, Eva — identity + safety rules)
              - The issue itself:
                  gh issue view "$TARGET_ISSUE" --repo "$TARGET_REPO" \
                    --json title,body,author,labels,createdAt
              - `researches/findings-backlog.md` — has Eva already
                surfaced this gap? Match by evidence URLs or title.
              - `researches/sources-index.md` — related to a tracked
                external source?
              - Recent audit reports
                (`ls -t researches/*-skills-audit.md | head -3`) —
                covered by recent Eva work?

            Don't read memory/CONTEXT.md or memory/HISTORY.md — those
            are for full Eva sessions, overkill for routing.

            ## Step 2 — Deep research (router-grade, not shallow triage)

            Investigate the issue properly — this analysis decides whether it
            advances to implementation:
              - Read ALL relevant source files in $TARGET_REPO, not just those
                named. Trace code paths end-to-end. grep for related patterns.
              - If the issue claims a tool/library/version behaves a certain way,
                VERIFY against current official docs (Context7 / WebFetch the
                release notes) before agreeing — many proposals cite specific CC /
                Codex versions; an unverified or hallucinated citation is a hold.
              - Assess RISK: is the change scoped to safe paths (skills/agents/
                scripts/docs), or does it touch `.github/workflows`, CI scripts,
                the security model, or break a public schema? Larger / sweeping /
                multi-subsystem = higher risk.

            ## Step 3 — Cross-reference

              gh pr list --repo "$TARGET_REPO" --state open \
                --json number,title,headRefName --limit 30
              gh issue list --repo "$TARGET_REPO" --state open \
                --json number,title --limit 30

            Look for: same component, similar wording, evidence-URL overlap,
            sibling proposals that should bundle/sequence with this one.

            ## Step 4 — Decide the routing verdict (before writing the comment)

            Emit `implement` ONLY when BOTH hold:
              1. Requirements are CLEAR — zero genuine open questions (the
                 ### Questions section will be exactly "None — requirements are clear.").
              2. LOW RISK — scoped to safe paths, no workflow/CI/security/schema-
                 breaking change, small-to-moderate surface, no unresolved
                 conflicts, and any external claim is VERIFIED.
            Otherwise the verdict is `hold`. DEFAULT TO `hold` when unsure — a wrong
            hold costs one operator click; a wrong implement spends a full build.

            ## Step 5 — Post ONE structured analysis comment (carries the verdict)

            Write to /tmp/analysis.md then post. The comment MUST begin with these
            two marker lines, each on its own line, before anything else (downstream
            machine-parses BOTH):

              <!-- ievo-issue-analysis -->
              <!-- ievo-verdict: implement -->   ← or `hold` per Step 4

            Then the structured body (exact headings; write "None identified" for
            an empty section). Include the marker line <!-- ievo-open-questions -->
            on its own line IMMEDIATELY BEFORE `### Questions` ONLY when there ARE
            real open questions:

              ### Understanding
              <restate the ask in your words; call out ambiguity / assumptions>

              ### Approach
              <how you'd implement — specific files, change shape, order>

              ### Questions
              <open questions blocking implementation, or exactly
               "None — requirements are clear.">

              ### Conflicts
              <conflicts with code / conventions / version-bump rules / siblings>

              ### Risks
              <edge cases, backwards-compat, CI implications, security, unverified claims>

            Post:
              gh issue comment "$TARGET_ISSUE" --repo "$TARGET_REPO" \
                --body-file /tmp/analysis.md

            ## Step 6 — Apply labels (classification + lifecycle state)

            Classification (safe-list, auto-apply — one primary):
              `bug`, `enhancement`, `question`, `documentation`,
              `discussion`, `meta-evolution`
            Plus secondary signals when found: `duplicate-of-#N`,
            `covered-by-audit-#N`.

            Lifecycle state (auto-apply EXACTLY one, per the verdict):
              - verdict `implement` → add `approved` (clear + low-risk; the
                implement step consumes this in a later phase)
              - verdict `hold` with open questions → add `needs-discussion`
              - verdict `hold`, no open questions but not low-risk → add `triage`

            Still operator-only (NEVER auto-apply): `critical`, `priority/*`,
            `accepted`, `rejected`, `wontfix`, `duplicate` (without #N),
            `good-first-issue`, `in-progress`.

            Ensure label exists then apply (both idempotent):
              gh label create "<label>" --repo "$TARGET_REPO" \
                --description "Eva lifecycle/classification" \
                --color "<color>" 2>/dev/null || true
              gh issue edit "$TARGET_ISSUE" --repo "$TARGET_REPO" \
                --add-label "<label>"

            Colors:
              bug: d73a4a, enhancement: a2eeef, question: d876e3,
              documentation: 0075ca, discussion: cfd3d7,
              meta-evolution: 5319e7, out-of-scope: e4e669,
              approved: 0e8a16, needs-discussion: fbca04, triage: ededed

            ## Safety reminders (non-negotiable)
              - NEVER close the issue, open PRs, or modify files. The router only analyzes + labels; implementation is a separate gated step (consumes the `approved` label).
              - NEVER apply `accepted` / `rejected` / `priority/*`
                labels. Operator-only decisions.
              - NEVER open linked PRs. Surface in comment; eva-research
                will pick up implementation OR operator opens manually.
              - If you can't classify confidently (vague issue, "help"
                title), post a comment asking for clarification rather
                than guessing. No label is fine.
              - Don't comment on issues opened by `ievo-eva` (yourself)
                or `github-actions[bot]` (job `if:` already filters,
                but worth a self-check).
              - Per `CLAUDE.md` "Verify documentation before changing
                or asserting tool/library behavior": if the issue
                claims a tool/library does X, verify via Context7 or
                official docs before agreeing/disagreeing in the
                comment.
              - Per `agent/ROLE.md` Safety Rule #10 (Symmetric
                recursive verification): if the issue cites a file
                path in another repo, verify via recursive tree
                search before claiming it doesn't exist.
