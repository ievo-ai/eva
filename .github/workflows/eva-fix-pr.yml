# Eva — Review-fix loop for Eva-authored PRs (eva#135)
#
# Restores, on the eva side, the auto-fix loop v1's `review-fixer.yml` (in
# ievo-ai/skills) provided before skills#277 deleted it with the v1 cutover.
# When eva-review-pr.yml posts REQUEST_CHANGES on an `ievo-eva[bot]`-authored PR
# (branch `eva-impl/*`, OR `evolution/consolidate-*` — eva#250, the lesson-
# consolidator's own self-heal loop), it dispatches `fix-pr` here; this workflow
# checks out the PR branch, reads Eva's own review findings, fixes them, runs the
# target repo's local gate, and pushes a `[pr-fix-N]`-marked commit. The push
# re-fires product gates → workflow_run → eva-review-pr re-reviews. The loop
# continues until APPROVE or the budget (5 rounds for `eva-impl/*`, 3 for
# `evolution/consolidate-*` — eva#250) is spent.
#
# WHY a dedicated workflow (not a job in eva-implement.yml — eva#135 operator
# answer #1): distinct trigger (an INTERNAL `repository_dispatch: fix-pr` sent by
# eva-review-pr), a distinct and NARROWER trust surface than the builder, and
# eva-implement's existing gate stays untouched. The fixer RE-ENTERS an existing
# branch (higher blast radius than opening a new one), so its gate is stricter.
#
# TRUST GATE (eva#135 operator answer #2 — three stacked conditions, ALL
# required; any mismatch → fail-safe exit, no push):
#   1. Fired only by eva-review-pr's own dispatch. `repository_dispatch` can only
#      be sent by a principal with repo write; the `fix-pr` event type is emitted
#      ONLY by eva-review-pr. No external event type reaches this workflow.
#   2. The target PR's head branch matches `eva-impl/*` or `evolution/consolidate-*`
#      (exact prefixes only, eva#250) AND the PR author is the ievo-eva App
#      (`ievo-eva[bot]`) — NEVER a human PR (humans fix their own reviews; v1
#      rule kept).
#   3. The payload carries the triggering review id; this workflow RE-FETCHES that
#      review via the API and verifies its state is CHANGES_REQUESTED and it was
#      posted by a trusted reviewer (the App, or a MEMBER/OWNER — eva-review-pr
#      posts the REQUEST_CHANGES on an App-authored PR via the PAT = the operator,
#      a different principal, so its author_association is OWNER) before touching
#      anything.
# The fixer's INPUT is Eva's OWN review text + an App-authored branch — no
# third-party free text enters the loop.
#
# BUDGET (eva#135 operator answer #4): fully independent per PR, counted as
# `[pr-fix-N]` markers in THAT PR's branch history only (no sharing; there is no
# issue-handler here, and there is no `/fix` extension command in v1 of the
# fixer). Default 5 rounds (`EVA_FIX_BUDGET`); `evolution/consolidate-*` PRs get
# a tighter 3-round cap (`EVA_FIX_BUDGET_CONSOLIDATE`, eva#250 operator answer
# #3) since their fix is a narrow, mechanical ID-renumber, not an open-ended code
# fix — mirrors eva#132's self-approve cap philosophy. On exhaustion: comment +
# `eva-fix-budget-exhausted` label for the operator, then stop. The terminal
# labels below block re-triggering until the operator removes them.
#
# WORKFLOW-FILE HAND-OFF (eva#135 operator answer #3): the ievo-eva App lacks the
# `Workflows` permission (eva#132/#133 lesson), so a fix that would touch
# `.github/workflows/**` CANNOT be pushed. In that case the agent does NOT push —
# it posts the patch as a PR comment (eva#133-style), adds `eva-handoff-workflows`,
# and stops. That hand-off does NOT consume a `[pr-fix-N]` slot (nothing was
# pushed); the label prevents re-triggering until the operator clears it.
#
# SAFETY: the fixer NEVER merges (eva-review-pr's existing auto-merge stays the
# only merge path). Per-PR concurrency, cancel-in-progress: false (never abandon a
# half-pushed fix).

name: "Eva: Fix PR"

on:
  # Internal only: eva-review-pr dispatches this when it posts REQUEST_CHANGES on
  # an App-authored eva-impl/* PR. No other event type reaches this workflow.
  repository_dispatch:
    types: [fix-pr]

# One in-flight fix per PR; never cancel a fix mid-push (a cancelled push could
# leave the branch in a half-fixed state that still reads as CHANGES_REQUESTED).
concurrency:
  group: eva-fix-pr-${{ github.event.client_payload.repo }}-${{ github.event.client_payload.pr_number }}
  cancel-in-progress: false

permissions:
  contents: read       # the actual push uses the App token minted below, not this
  pull-requests: write
  id-token: write       # required by anthropics/claude-code-action@v1's OIDC startup

jobs:
  fix:
    name: "Eva: Fix PR"
    runs-on: ubuntu-latest
    # Capped at 50 for the same reason as eva-implement: the App installation
    # token minted below is valid 1h from job start; keep the job under 50 min so
    # the late `git push` always runs on a still-valid token.
    timeout-minutes: 50

    steps:
      # --- Auth: fix as the ievo-eva App (ievo-eva[bot]) so the [pr-fix-N] commit
      # is attributed to the App, same principal that authored the PR. The push
      # only works for NON-workflow files (App lacks the Workflows permission);
      # a workflow-file fix hands off instead (see the prompt's hand-off phase). ---
      - name: Generate App token
        if: vars.USE_GITHUB_APP == 'true'
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547  # v1.12.0 — SHA-pinned: mints an org-wide App token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ievo-ai
          # eva#156 — request the token's permissions EXPLICITLY (same fix PR #153
          # applied to eva-implement). The action's default mint (inherit ALL
          # installation permissions) does NOT carry `workflows: write` to the
          # token even though the App-level grant is accepted — so any fix that
          # pushes a `.github/workflows/**` diff is refused ("refusing to allow a
          # GitHub App to create or update workflow without workflows permission").
          # GitHub only surfaces `workflows` on the minted token when it is named
          # here explicitly.
          #
          # This list MUST enumerate EVERY permission the downstream steps use —
          # once any permission-* input is set the token carries ONLY the listed
          # ones, no longer the full installation set:
          #   contents:write      — checkout + agent `git push` (branch + files)
          #   workflows:write      — agent push of `.github/workflows/**` diffs
          #   issues:write         — label create/edit + issue/PR comments (labels
          #                          live on the issues endpoint)
          #   pull-requests:write  — `gh pr comment` (verify, budget, fixer, failure)
          #   metadata:read        — baseline repo `gh api` reads (pulls/reviews)
          permission-contents: write
          permission-workflows: write
          permission-issues: write
          permission-pull-requests: write
          permission-metadata: read

      - name: Set auth token
        id: auth
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          PAT_TOKEN: ${{ secrets.EVA_PAT_GITHUB_TOKEN }}
        run: |
          # No `pull_request` event here (repository_dispatch only), so the App
          # token is NOT subject to the workflow-boundary scope downgrade that
          # forces eva-review-pr onto a PAT — use the App token directly so the
          # fix commit is authored by ievo-eva[bot].
          if [ -n "$APP_TOKEN" ]; then
            echo "token=$APP_TOKEN" >> "$GITHUB_OUTPUT"
            echo "Using App token — fix commit authored by ievo-eva[bot]"
          else
            echo "token=$PAT_TOKEN" >> "$GITHUB_OUTPUT"
            echo "Using PAT fallback (USE_GITHUB_APP != true)"
          fi

      # --- Resolve + re-verify: the stacked trust gate (operator answer #2).
      # Everything here is fail-safe: any mismatch sets skip=true and the job ends
      # without touching the branch. ---
      - name: Resolve + verify PR context
        id: ctx
        env:
          GH_TOKEN: ${{ steps.auth.outputs.token }}
          PAYLOAD_REPO: ${{ github.event.client_payload.repo }}
          PAYLOAD_PR: ${{ github.event.client_payload.pr_number }}
          PAYLOAD_REVIEW_ID: ${{ github.event.client_payload.review_id }}
          FIX_BUDGET: ${{ vars.EVA_FIX_BUDGET || '5' }}
        run: |
          REPO="$PAYLOAD_REPO"
          PR_NUM="$PAYLOAD_PR"
          REVIEW_ID="$PAYLOAD_REVIEW_ID"

          if [ -z "$REPO" ] || [ -z "$PR_NUM" ] || [ -z "$REVIEW_ID" ]; then
            echo "Missing repo / pr_number / review_id in payload — skipping (fail-safe)."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # PR must be open — a closed/merged PR must never be pushed to.
          PR_JSON=$(gh api "repos/$REPO/pulls/$PR_NUM" 2>/dev/null || echo '{}')
          STATE=$(printf '%s' "$PR_JSON" | jq -r '.state // empty')
          if [ "$STATE" != "open" ]; then
            echo "PR $REPO#$PR_NUM is not open (state=$STATE) — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # Condition 2a: head branch must be eva-impl/* (code-fix PRs) or
          # evolution/consolidate-* (eva#250 — the lesson-consolidator's own
          # self-heal loop; eva-review-pr already dispatches fix-pr for both
          # prefixes, but this gate previously swallowed the second one
          # silently). Exact prefix only — no broader glob, so this can't be
          # reused to re-enter an unrelated branch that happens to match.
          HEAD_REF=$(printf '%s' "$PR_JSON" | jq -r '.head.ref // empty')
          case "$HEAD_REF" in
            eva-impl/*|evolution/consolidate-*) : ;;
            *)
              echo "Head branch '$HEAD_REF' is not eva-impl/* or evolution/consolidate-* — refusing (fail-safe)."
              echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac

          # Condition 2b: PR author must be the ievo-eva App. Humans fix their own
          # reviews (v1 rule) — the fixer never re-enters a human-authored branch.
          PR_AUTHOR=$(printf '%s' "$PR_JSON" | jq -r '.user.login // empty')
          if [ "$PR_AUTHOR" != "ievo-eva[bot]" ]; then
            echo "PR author '$PR_AUTHOR' is not ievo-eva[bot] — refusing (fail-safe)."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # Condition 3: re-fetch the triggering review by id and verify it is a
          # genuine CHANGES_REQUESTED from a trusted reviewer. This guards against
          # a stale dispatch (review since dismissed / PR state moved) and against
          # any payload whose review_id does not resolve to a real blocking review.
          REVIEW_JSON=$(gh api "repos/$REPO/pulls/$PR_NUM/reviews/$REVIEW_ID" 2>/dev/null || echo '{}')
          REVIEW_STATE=$(printf '%s' "$REVIEW_JSON" | jq -r '.state // empty')
          REVIEW_AUTHOR=$(printf '%s' "$REVIEW_JSON" | jq -r '.user.login // empty')
          REVIEW_ASSOC=$(printf '%s' "$REVIEW_JSON" | jq -r '.author_association // empty')
          if [ "$REVIEW_STATE" != "CHANGES_REQUESTED" ]; then
            echo "Review $REVIEW_ID state is '$REVIEW_STATE' (not CHANGES_REQUESTED) — skipping (fail-safe)."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # eva-review-pr posts REQUEST_CHANGES on an App-authored PR via the PAT
          # (the operator = OWNER); if ever posted by the App directly the login is
          # ievo-eva[bot]. Accept either — reject anything else.
          if [ "$REVIEW_AUTHOR" != "ievo-eva[bot]" ] \
             && [ "$REVIEW_ASSOC" != "MEMBER" ] && [ "$REVIEW_ASSOC" != "OWNER" ]; then
            echo "Review $REVIEW_ID author '$REVIEW_AUTHOR' (assoc=$REVIEW_ASSOC) is not a trusted reviewer — refusing (fail-safe)."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # Terminal-label guard: a prior round already handed off to the operator
          # (workflow-file fix) or spent the budget. Do NOT re-enter until the
          # operator clears the label. PR labels live on the issues endpoint.
          LABELS=$(gh api "repos/$REPO/issues/$PR_NUM/labels" --jq '[.[].name] | join(" ")' 2>/dev/null || echo "")
          case " $LABELS " in
            *" eva-handoff-workflows "*)
              echo "PR carries eva-handoff-workflows — operator must apply the handed-off patch first. Skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
            *" eva-fix-budget-exhausted "*)
              echo "PR carries eva-fix-budget-exhausted — budget already spent, operator owns it. Skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
            *" eva-fix-declined "*)
              echo "PR carries eva-fix-declined — a prior round deliberately stopped without pushing (finding disputed or gate not green, eva#170); operator must disposition first. Skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac

          {
            echo "repo=$REPO"
            echo "pr_number=$PR_NUM"
            echo "review_id=$REVIEW_ID"
            echo "head_ref=$HEAD_REF"
            echo "skip=false"
          } >> "$GITHUB_OUTPUT"

      # --- Checkout the PR branch (the eva-impl/* head) so the fix pushes back to
      # the SAME branch. Full history so the [pr-fix-N] budget count is accurate. ---
      - name: Checkout PR branch
        if: steps.ctx.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.ctx.outputs.repo }}
          ref: ${{ steps.ctx.outputs.head_ref }}
          token: ${{ steps.auth.outputs.token }}
          fetch-depth: 0

      # --- HARD budget guard (review finding on eva#137): the 5-round budget is
      # primarily enforced by the fixer prompt, but an LLM miscount or ignored
      # instruction must not be able to loop. Count [pr-fix-N] markers in the
      # branch history deterministically and stop BEFORE the agent runs.
      # eva#250: an evolution/consolidate-* PR's fix is a narrow, mechanical
      # ID-renumber, not an open-ended code fix, so it gets a TIGHTER cap (3,
      # mirrors eva#132's self-approve cap philosophy) than the default
      # eva-impl/* budget (5). ---
      - name: Enforce fix budget (hard guard)
        id: budget
        if: steps.ctx.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.auth.outputs.token }}
          REPO: ${{ steps.ctx.outputs.repo }}
          PR_NUM: ${{ steps.ctx.outputs.pr_number }}
          MAX_ROUNDS: ${{ startsWith(steps.ctx.outputs.head_ref, 'evolution/consolidate-') && (vars.EVA_FIX_BUDGET_CONSOLIDATE || '3') || (vars.EVA_FIX_BUDGET || '5') }}
        run: |
          # Same counting semantics as the fixer prompt (base ref + marker regex),
          # so the hard guard and the soft (prompt) budget can never diverge.
          BASE=$(gh api "repos/$REPO/pulls/$PR_NUM" --jq '.base.ref' 2>/dev/null || echo "main")
          ROUNDS=$(git log --format='%s' "origin/$BASE..HEAD" 2>/dev/null | grep -cE '\[pr-fix-[0-9]+\]' || true)
          echo "Fix rounds already on this branch: $ROUNDS (max $MAX_ROUNDS, base $BASE)"
          # Pre-agent round count — `Verify fix contract` (eva#170) compares the
          # remote branch against this to detect whether a fix round was pushed.
          # max_rounds is re-exposed so downstream steps (agent settings, this
          # step's own exhaustion message) use the SAME resolved cap, never a
          # re-evaluated (and potentially different) expression.
          {
            echo "rounds=$ROUNDS"
            echo "max_rounds=$MAX_ROUNDS"
          } >> "$GITHUB_OUTPUT"
          if [ "$ROUNDS" -ge "$MAX_ROUNDS" ]; then
            # eva#146 — a spent fix budget is an operator-owned state; surface it
            # in the operator's cross-repo inbox alongside the specific terminal
            # label. Both via the App token (steps.auth) already in this step.
            gh label create needs-operator --repo "$REPO" \
              --description "Pipeline blocked on the human operator to unblock" \
              --color "e11d21" 2>/dev/null || true
            gh issue edit "$PR_NUM" --repo "$REPO" \
              --add-label eva-fix-budget-exhausted --add-label needs-operator 2>/dev/null || true
            gh pr comment "$PR_NUM" --repo "$REPO" --body \
              "Fix budget exhausted ($ROUNDS/$MAX_ROUNDS \`[pr-fix-N]\` rounds) — hard workflow guard, independent of the fixer agent. Operator review needed; the fixer will not run again on this PR." || true
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      # Per-issue model/effort escalation — fix rounds INHERIT the escalation the
      # issue carries (eva#172). The fixer operates on a PR, so the escalation
      # label lives on the ISSUE the PR closes (`Closes #N` → closingIssuesReferences),
      # not the PR. Same precedence + whitelist as eva-implement's resolve step:
      # issue LABEL > repo VARIABLE (EVA_MODEL_FIX / EVA_EFFORT_FIX) > DEFAULT
      # (opus / high). Only whitelisted literals reach the CLI. No linked issue,
      # or no model/effort label, → var || default (byte-for-byte the eva#161
      # behaviour), so an un-escalated PR is unchanged.
      - name: Resolve model + effort
        id: resolve
        if: steps.ctx.outputs.skip != 'true' && steps.budget.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.auth.outputs.token }}
          REPO: ${{ steps.ctx.outputs.repo }}
          PR_NUM: ${{ steps.ctx.outputs.pr_number }}
          VAR_MODEL: ${{ vars.EVA_MODEL_FIX }}
          VAR_EFFORT: ${{ vars.EVA_EFFORT_FIX }}
          DEFAULT_MODEL: opus
          DEFAULT_EFFORT: high
        run: |
          # The issue this PR closes carries the escalation label (if any).
          ISSUE_NUM=$(gh pr view "$PR_NUM" --repo "$REPO" \
            --json closingIssuesReferences \
            --jq '.closingIssuesReferences[0].number // ""' 2>/dev/null || echo "")

          MODEL_LABEL=""
          EFFORT_LABEL=""
          if [ -n "$ISSUE_NUM" ]; then
            LJSON=$(gh issue view "$ISSUE_NUM" --repo "$REPO" --json labels --jq '[.labels[].name]' 2>/dev/null || echo '[]')
            MODEL_LABEL=$(printf '%s' "$LJSON" | jq -r 'map(select(startswith("model:"))) | first // ""')
            EFFORT_LABEL=$(printf '%s' "$LJSON" | jq -r 'map(select(startswith("effort:"))) | first // ""')
          fi

          case "$MODEL_LABEL" in
            model:opus)   MODEL="opus" ;;
            model:fable)  MODEL="fable" ;;
            *)            MODEL="${VAR_MODEL:-$DEFAULT_MODEL}" ;;
          esac
          case "$EFFORT_LABEL" in
            effort:low|effort:medium|effort:high|effort:xhigh|effort:max) EFFORT="${EFFORT_LABEL#effort:}" ;;
            *)                                                            EFFORT="${VAR_EFFORT:-$DEFAULT_EFFORT}" ;;
          esac

          echo "Resolved model=$MODEL effort=$EFFORT (issue #${ISSUE_NUM:-none}, model_label='$MODEL_LABEL' effort_label='$EFFORT_LABEL')"
          {
            echo "model=$MODEL"
            echo "effort=$EFFORT"
          } >> "$GITHUB_OUTPUT"

      - name: Configure git identity
        if: steps.ctx.outputs.skip != 'true' && steps.budget.outputs.skip != 'true'
        run: |
          git config --global user.name "iEVO Eva"
          git config --global user.email "noreply@ievo.ai"

      # Polyglot: the target repo may not be Python. Only run the uv toolchain when
      # the checked-out target actually has a pyproject.toml; otherwise the agent
      # installs whatever the repo's own gate needs via Bash (same as eva-implement).
      - name: Detect project type
        id: detect
        if: steps.ctx.outputs.skip != 'true' && steps.budget.outputs.skip != 'true'
        run: |
          if [ -f pyproject.toml ]; then
            echo "python=true" >> "$GITHUB_OUTPUT"
            echo "Target is a Python project (pyproject.toml present)."
          else
            echo "python=false" >> "$GITHUB_OUTPUT"
            echo "Target is NOT a Python project — skipping the uv toolchain."
          fi

      - name: Set up Python 3.13
        if: steps.ctx.outputs.skip != 'true' && steps.budget.outputs.skip != 'true' && steps.detect.outputs.python == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        if: steps.ctx.outputs.skip != 'true' && steps.budget.outputs.skip != 'true' && steps.detect.outputs.python == 'true'
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        if: steps.ctx.outputs.skip != 'true' && steps.budget.outputs.skip != 'true' && steps.detect.outputs.python == 'true'
        run: uv sync --group dev 2>/dev/null || uv sync

      # --- iEvo plugin dogfooding (eva#158) -------------------------------------
      # The fixer dogfoods the ievo plugin too: /ievo:evolution to capture "what the
      # implementer got wrong" on EVERY REQUEST_CHANGES round (the review event is
      # the mechanical trigger), and /ievo:feedback on plugin malfunction. Same
      # verified delivery mechanism + failure-isolation rationale as eva-implement.yml
      # (see that file's block): a `continue-on-error` install into ~/.claude that
      # the action's own `claude` picks up; DORMANT until EVA_IEVO_PLUGIN_ENABLED=true.
      - name: Install iEvo plugin (dogfood, best-effort)
        id: ievo_plugin
        if: steps.ctx.outputs.skip != 'true' && steps.budget.outputs.skip != 'true' && vars.EVA_IEVO_PLUGIN_ENABLED == 'true'
        continue-on-error: true   # operator Q5: a plugin failure must NEVER fail the build
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          READY=false
          if npm install -g @anthropic-ai/claude-code \
             && timeout 300 claude plugin marketplace add ievo-ai/skills \
             && timeout 300 claude plugin install ievo@ievo-skills \
             && claude plugin list 2>/dev/null | grep -qi 'ievo'; then
            READY=true
            echo "iEvo plugin installed + enabled (user scope) — skills available to the fixer."
          else
            echo "iEvo plugin unavailable this run — the fixer proceeds WITHOUT it (degraded, operator Q5)."
          fi
          echo "ready=$READY" >> "$GITHUB_OUTPUT"

      # READ path for Eva's evolution store (operator Q1 — mandatory). Pulled from
      # ievo-ai/eva@main (Eva-side, not the target repo). Best-effort. Also seeds the
      # capture file the fixer appends REQUEST_CHANGES lessons to.
      - name: Load Eva evolution store (best-effort)
        id: evo_store
        if: steps.ctx.outputs.skip != 'true' && steps.budget.outputs.skip != 'true' && vars.EVA_IEVO_PLUGIN_ENABLED == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          STORE_FILE="$RUNNER_TEMP/eva-evolution-store.md"
          CAPTURE_FILE="$RUNNER_TEMP/eva-evolution-capture.md"
          if gh api "repos/ievo-ai/eva/contents/agent/memory/evolution/lessons.md?ref=main" \
               --jq '.content' 2>/dev/null | base64 -d > "$STORE_FILE" 2>/dev/null \
             && [ -s "$STORE_FILE" ]; then
            echo "Loaded Eva evolution store ($(wc -l < "$STORE_FILE") lines)."
          else
            echo "No Eva evolution store yet (or fetch failed) — starting empty." > "$STORE_FILE"
          fi
          : > "$CAPTURE_FILE"
          {
            echo "store=$STORE_FILE"
            echo "capture=$CAPTURE_FILE"
          } >> "$GITHUB_OUTPUT"

      # The prompt lives in EVA (this workflow's repo). When the fixer targets a
      # cross-repo PR the working tree is that other repo, so fetch the prompt from
      # eva via the API at the commit this workflow is running (same as
      # eva-implement's prompt load).
      #
      # CONSTRAINT: eva-fix-pr.md must never contain the literal string
      # "EVA_FIX_PROMPT_EOF" on a line by itself (heredoc delimiter).
      - name: Load fix prompt
        if: steps.ctx.outputs.skip != 'true' && steps.budget.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.auth.outputs.token }}
          PROMPT_REPO: ${{ github.repository }}
          PROMPT_REF: ${{ github.sha }}
        run: |
          PROMPT=$(gh api \
            "repos/$PROMPT_REPO/contents/.github/prompts/eva-fix-pr.md?ref=$PROMPT_REF" \
            --jq '.content' | base64 -d)
          if [ -z "$PROMPT" ]; then
            echo "::error::eva-fix-pr.md not found in $PROMPT_REPO@$PROMPT_REF"; exit 1
          fi
          if printf '%s\n' "$PROMPT" | grep -qxF 'EVA_FIX_PROMPT_EOF'; then
            echo "::error::eva-fix-pr.md contains the heredoc delimiter"; exit 1
          fi
          {
            echo "FIX_PROMPT<<EVA_FIX_PROMPT_EOF"
            printf '%s\n' "$PROMPT"
            echo "EVA_FIX_PROMPT_EOF"
          } >> "$GITHUB_ENV"

      - name: Run Fix agent
        if: steps.ctx.outputs.skip != 'true' && steps.budget.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # eva#156 root cause (same as eva#151 → PR #154 fixed in eva-implement):
          # without this input the action performs its default OIDC exchange and
          # configures the git credential with the CLAUDE GitHub App's token —
          # overriding the checkout-persisted ievo-eva token. That app has
          # contents:write (so ordinary [pr-fix-N] pushes worked) but NOT workflows
          # — so any `.github/workflows/**` fix push would be refused. Passing OUR
          # minted App token here makes the fixer's `git push` run as ievo-eva with
          # the explicit permission set from the Generate App token step (incl.
          # workflows:write). Fix-round pushes are now attributed to the correct
          # principal (ievo-eva[bot], same as the PR author), not the Claude App.
          github_token: ${{ steps.auth.outputs.token }}
          show_full_output: true
          # eva-review-pr dispatches fix-pr with the App token, so the triggering
          # actor is ievo-eva[bot]. The action rejects bot-initiated runs by
          # default — allow OUR bot. Trust is NOT weakened: the real gate is the
          # stacked trust re-verification in "Resolve + verify PR context" above.
          allowed_bots: "ievo-eva"
          # `Skill` appended ONLY when plugin dogfooding is enabled (eva#158);
          # byte-for-byte identical to before with the flag unset.
          #
          # Model + effort (eva#161 runbook + eva#172 per-issue escalation): the
          # `Resolve model + effort` step above applied LABEL (inherited from the
          # issue this PR closes) > repo VARIABLE (EVA_MODEL_FIX / EVA_EFFORT_FIX) >
          # DEFAULT (opus / high), so a fable-escalated issue's fix rounds also run
          # on Fable. To switch the flow globally set the Actions variable (empty →
          # the default). `--effort` is a real per-session CLI flag (docs:
          # code.claude.com/docs/en/model-config#adjust-effort-level); `high` is
          # also the model-default effort for opus (Opus 4.8), so the default is
          # behavior-preserving, not a silent uplift.
          claude_args: |
            --model ${{ steps.resolve.outputs.model }}
            --effort ${{ steps.resolve.outputs.effort }}
            --allowedTools "Bash,Edit,Read,Write,Glob,Grep,WebFetch,WebSearch${{ vars.EVA_IEVO_PLUGIN_ENABLED == 'true' && ',Skill' || '' }}"
          settings: |
            {
              "env": {
                "GH_TOKEN": "${{ steps.auth.outputs.token }}",
                "TARGET_REPO": "${{ steps.ctx.outputs.repo }}",
                "TARGET_PR": "${{ steps.ctx.outputs.pr_number }}",
                "REVIEW_ID": "${{ steps.ctx.outputs.review_id }}",
                "FIX_BUDGET": "${{ steps.budget.outputs.max_rounds }}",
                "EVA_IEVO_PLUGIN_READY": "${{ steps.ievo_plugin.outputs.ready }}",
                "EVA_EVOLUTION_STORE": "${{ steps.evo_store.outputs.store }}",
                "EVA_EVOLUTION_CAPTURE": "${{ steps.evo_store.outputs.capture }}"
              }
            }
          prompt: ${{ env.FIX_PROMPT }}

      # WRITE path (operator Q1, per-run artifact): upload the REQUEST_CHANGES
      # lessons the fixer captured this round for later consolidation into
      # agent/memory/evolution/lessons.md. always() + best-effort.
      - name: Upload evolution capture (best-effort)
        if: always() && steps.ctx.outputs.skip != 'true' && steps.budget.outputs.skip != 'true' && vars.EVA_IEVO_PLUGIN_ENABLED == 'true' && steps.evo_store.outputs.capture != ''
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: eva-evolution-capture-pr-${{ steps.ctx.outputs.pr_number }}
          path: ${{ steps.evo_store.outputs.capture }}
          if-no-files-found: ignore
          retention-days: 90

      # Deterministic post-check (eva#170): a GREEN fix-agent step must have
      # produced one of the contract outcomes — a new [pr-fix-N] commit on the
      # REMOTE branch (the push is what re-fires gates → re-review; a local-only
      # commit is a stall), or a terminal label marking a deliberate no-push stop
      # (eva-handoff-workflows / eva-fix-budget-exhausted / eva-fix-declined, the
      # last added by eva#170 for the "finding disputed" and "gate not green"
      # stops which previously left only a comment). A run that self-reports
      # success while producing neither is the silent-stall class run 28705052982
      # exposed on the implement side: with no push there is no re-review
      # dispatch, so the PR strands on CHANGES_REQUESTED and nothing notices.
      # Implicit success() gate: a failed agent step is owned by `Note failure`.
      - name: Verify fix contract
        id: contract
        if: steps.ctx.outputs.skip != 'true' && steps.budget.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.auth.outputs.token }}
          REPO: ${{ steps.ctx.outputs.repo }}
          PR_NUM: ${{ steps.ctx.outputs.pr_number }}
          HEAD_REF: ${{ steps.ctx.outputs.head_ref }}
          PRE_ROUNDS: ${{ steps.budget.outputs.rounds }}
        run: |
          # Outcome 1: a new [pr-fix-N] commit landed on the remote branch.
          # Count remote-side (origin/<head>, freshly fetched) with the same
          # marker regex as the budget guard, and compare against the pre-agent
          # count. Any push WITHOUT the marker deliberately does not count — an
          # unmarked push would dodge the budget counter, which is operator-
          # attention-worthy in itself.
          #
          # Defensive re-assert (eva#222): claude-code-action's agent-mode git
          # setup unconditionally repoints `origin` at GITHUB_REPOSITORY (this
          # workflow's OWN repo, eva) during the "Run Fix agent" step above —
          # it derives the remote from the Actions runner's own env var, not
          # from this job's `repository:` checkout input. It ALSO removes the
          # checkout's host-keyed credential (`http.https://github.com/
          # .extraheader`) and re-embeds auth in the eva-pointing URL instead,
          # so a bare `set-url` alone leaves `origin` pointed at the right repo
          # but with NO credential — the fetch below would fail auth, not
          # merely fetch the wrong content. `gh auth setup-git` restores a
          # github.com credential helper backed by this step's own `GH_TOKEN`
          # first; the fixer prompt now does the identical two-line recovery
          # before its own push (Phase 6). Reset `origin` back to the real
          # target before trusting `git fetch origin`; the bare-set-url version
          # of this fix was observed producing a false "no fix pushed" contract
          # failure on a push that had actually succeeded (skills#535,
          # skills#528, 2026-08-01).
          gh auth setup-git
          git remote set-url origin "https://github.com/$REPO.git"
          BASE=$(gh api "repos/$REPO/pulls/$PR_NUM" --jq '.base.ref' 2>/dev/null || echo "main")
          git fetch origin "$BASE" "$HEAD_REF"
          NEW_ROUNDS=$(git log --format='%s' "origin/$BASE..origin/$HEAD_REF" 2>/dev/null | grep -cE '\[pr-fix-[0-9]+\]' || true)
          if [ "$NEW_ROUNDS" -gt "${PRE_ROUNDS:-0}" ]; then
            echo "Contract met: fix round pushed ($PRE_ROUNDS -> $NEW_ROUNDS [pr-fix-N] commits on origin/$HEAD_REF)."
            exit 0
          fi
          # Outcome 2: a terminal label marks a deliberate no-push stop.
          LABELS=$(gh api "repos/$REPO/issues/$PR_NUM/labels" --jq '[.[].name] | join(" ")' 2>/dev/null || echo "")
          case " $LABELS " in
            *" eva-handoff-workflows "* | *" eva-fix-budget-exhausted "* | *" eva-fix-declined "*)
              echo "Contract met: terminal label present (deliberate no-push stop)."
              exit 0 ;;
          esac
          # Neither: the eva#170 silent-stall class. Flag the operator (all
          # best-effort so every command runs), then fail the job so the run can
          # never read as green.
          echo "remediated=true" >> "$GITHUB_OUTPUT"
          gh label create needs-operator --repo "$REPO" \
            --description "Pipeline blocked on the human operator to unblock" \
            --color "e11d21" 2>/dev/null || true
          gh issue edit "$PR_NUM" --repo "$REPO" \
            --add-label needs-operator 2>/dev/null || true
          gh pr comment "$PR_NUM" --repo "$REPO" --body \
            "Eva's fix run ended without pushing a fix round and without marking a deliberate stop (no new \`[pr-fix-N]\` commit on the branch, no terminal label) — the eva#170 silent-stall class. Flagged \`needs-operator\`: the outstanding review still blocks this PR and no re-review will fire without a push. Operator: inspect the run logs, then push a fix manually or re-trigger the review loop." || true
          echo "::error::Fix contract violated: no new [pr-fix-N] commit on origin/$HEAD_REF and no terminal label after the agent step."
          exit 1

      # If the fixer crashed AFTER passing the trust gate, leave a breadcrumb so
      # the PR does not silently strand. No claim label to release (unlike
      # eva-implement) — the loop is bounded by the [pr-fix-N] budget regardless.
      # Skipped when `Verify fix contract` already remediated (it comments and
      # flags the operator itself before failing the job).
      - name: Note failure
        if: failure() && steps.ctx.outputs.skip == 'false' && steps.budget.outputs.skip != 'true' && steps.contract.outputs.remediated != 'true'
        env:
          GH_TOKEN: ${{ steps.auth.outputs.token }}
          REPO: ${{ steps.ctx.outputs.repo }}
          PR_NUM: ${{ steps.ctx.outputs.pr_number }}
        run: |
          gh pr comment "$PR_NUM" --repo "$REPO" --body \
            "Eva's fix run failed or was interrupted after passing the trust gate. No commit was pushed this round (the [pr-fix-N] budget is unchanged). eva-review-pr will not re-dispatch unless a new push re-triggers review — operator can inspect the run logs or push a fix manually." || true
