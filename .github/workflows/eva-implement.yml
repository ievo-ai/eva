# Eva — Issue Implementer (Phase 1b of the issue-pipeline migration, eva#106)
#
# When the Issue Router (eva-on-issue.yml) applies the `approved` label to an
# issue (verdict = implement: requirements clear AND low risk), Eva autonomously
# builds the change and opens a PR. Review + merge are handled SEPARATELY by
# eva-review-pr.yml (sensitive-path gated) — this workflow's job ends when it
# opens the ready PR.
#
# Trigger paths:
#   - issues:[labeled] (label == approved)  — eva-local issues
#   - repository_dispatch:[implement-issue]  — cross-repo (Phase 2 seam; the
#     toolchain setup below is eva-specific Python/uv for now)
#
# DORMANT BY DEFAULT: the job runs ONLY when repo variable
# `EVA_IMPLEMENT_ENABLED == 'true'`. This lets the workflow merge as inert
# infrastructure; the operator flips the flag after a deliberate smoke test.
# This is the single most autonomous workflow in the org (Eva writes code AND
# it auto-merges on a clean non-sensitive review) — the flag is the safety valve.
#
# Merge-path design (eva#106; see CLAUDE.md "Identity model"): the PR is created
# by `gh`/`git` authenticated as the `ievo-eva` **App** (an installation token via
# actions/create-github-app-token), so the PR is authored by `ievo-eva[bot]` — NOT
# the operator's personal account. (The intended `ievo-eva` machine USER account
# is blocked by GitHub's new-account spam flag; EVA_PAT_GITHUB_TOKEN currently
# authenticates as the operator, which would mis-attribute Eva's autonomous code.)
#
# Because the PR author IS the App, eva-review-pr's App review CANNOT approve it
# (GitHub self-approval block → an App-token review posts as COMMENTED). So
# eva-review-pr posts the APPROVE for App-authored PRs via the PAT instead (a
# DIFFERENT principal — currently the operator) — a valid cross-principal review
# that satisfies `main`'s required-review (=1). Classic-branch-protection
# `bypass_pull_request_allowances` does NOT help here: it does not waive
# required-review for an App merging via the REST API (proven on #114,
# 2026-06-29 — "base branch policy prohibits the merge"). With the cross-principal
# APPROVE present, eva-review-pr's Auto-merge step (direct `gh pr merge`) merges
# normally, gated on Claude's parsed decision == APPROVE AND the sensitive-path
# check (risky changes still route to the operator). The `eva-impl/` branch
# prefix is kept so eva-review-pr's loop-prevention carve-out fires regardless of
# triggering actor. Lint & Test must still pass (strict status check), and the
# branch must be up to date with main (it is: built fresh off main).
#
# Claim + rate-limit: an atomic-ish label swap (`approved` → `eva-implementing`)
# claims the issue so a duplicate `labeled` event is a no-op; a best-effort cap
# of MAX_INFLIGHT concurrent builds bounds the blast radius. `eva-implementing`
# is a distinct claim label (NOT `in-progress`, which the router reserves as
# operator-only).
#
# Security: untrusted issue title/body never reach `run:` blocks via ${{ }}
# interpolation — the Claude action receives them via `gh issue view` inside the
# agent's Bash subprocess. Same shell-injection defense as eva-on-issue.yml.
#
# Tracked as godfather task #42 / eva#106.

name: "Eva: Implement"

on:
  issues:
    types: [labeled]
  repository_dispatch:
    types: [implement-issue]

# One in-flight build per issue; never cancel a build mid-flight.
concurrency:
  group: eva-implement-${{ github.event.client_payload.repo || github.repository }}-${{ github.event.client_payload.issue_number || github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  id-token: write   # required by anthropics/claude-code-action@v1's OIDC startup
                    # (same as eva-on-issue.yml; the action fails to boot without it)

jobs:
  implement:
    name: "Eva: Implement"
    runs-on: ubuntu-latest
    # Capped at 50 (NOT 60) on purpose: the ievo-eva App installation token minted
    # in `Generate App token` is valid for 1 hour from job start. Keeping the job
    # under 50 min guarantees that single token never expires mid-build — the agent's
    # late `git push` / `gh pr create` always run on a still-valid token. A build
    # that needs >50 min on a "clear, low-risk" router-approved task is itself a
    # red flag; let it time out → claim cleanup → triage for the operator.
    timeout-minutes: 50

    # DORMANT until the operator sets repo variable EVA_IMPLEMENT_ENABLED=true.
    # Then build ONLY for trusted authors. This author gate is a hard security
    # boundary, NOT redundant with the router: eva-on-issue.yml gates the
    # `approved` verdict on clarity + low-risk ONLY (member path) or on a
    # skeptic-mode self-approve (bot path) — so trust MUST be re-verified here,
    # at the CONSUMING workflow, never relying solely on the label producer.
    #
    # Trust matrix (eva#132 — kept identical to forward-to-eva.yml's gate):
    #   (issue author = human MEMBER/OWNER)
    #     OR
    #   (issue author = ievo-eva[bot] AND the `approved` sender ∈
    #        {human MEMBER/OWNER, ievo-eva[bot]})
    # The bot path admits Eva's OWN skeptic-mode self-approvals (sender = the
    # App) and one-click human adoption of a bot proposal (sender = operator).
    # We pin the EXACT App login (`ievo-eva[bot]`), never a general `user.type`
    # relaxation — otherwise any installed bot becomes an autonomous-build source
    # (eva#132 security note). Without the human-MEMBER/OWNER floor on the member
    # path, a non-member's issue body would become trusted requirements for an
    # agent holding the ievo-eva App token (org-wide write) + Bash/Write/WebFetch
    # (a prompt-injection → token path).
    #
    #   - issues: the coarse if: below admits the candidate (author is a
    #     MEMBER/OWNER, OR author is the App AND the label sender is a User/the
    #     App). The `Claim issue` step then PRECISELY verifies the sender's repo
    #     permission via the API for the bot path (fail-safe: refuse on <write).
    #   - repository_dispatch: the trusted forwarder MUST supply
    #     client_payload.author_association (upstream author's association) and,
    #     for the bot path, client_payload.issue_author_login +
    #     approved_by_association / approved_by_login (who applied `approved`).
    #     Phase 2 contract — the skills forward-to-eva.yml gate mirrors this.
    if: >
      vars.EVA_IMPLEMENT_ENABLED == 'true' &&
      (
        (github.event_name == 'issues' &&
         github.event.label.name == 'approved' &&
         !github.event.issue.pull_request &&
         (github.event.issue.author_association == 'MEMBER' ||
          github.event.issue.author_association == 'OWNER' ||
          (github.event.issue.user.login == 'ievo-eva[bot]' &&
           (github.event.sender.type == 'User' ||
            github.event.sender.login == 'ievo-eva[bot]'))))
        ||
        (github.event_name == 'repository_dispatch' &&
         (github.event.client_payload.author_association == 'MEMBER' ||
          github.event.client_payload.author_association == 'OWNER' ||
          (github.event.client_payload.issue_author_login == 'ievo-eva[bot]' &&
           (github.event.client_payload.approved_by_association == 'MEMBER' ||
            github.event.client_payload.approved_by_association == 'OWNER' ||
            github.event.client_payload.approved_by_login == 'ievo-eva[bot]'))))
      )

    steps:
      # --- Auth: author the PR as the ievo-eva App (ievo-eva[bot]), not the
      # operator. EVA_PAT_GITHUB_TOKEN is only a fallback if the App is disabled;
      # it currently authenticates as the operator, so the App path is preferred. ---
      - name: Generate App token
        if: vars.USE_GITHUB_APP == 'true'
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547  # v1.12.0 — SHA-pinned: this step mints an org-wide App token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ievo-ai
          # eva#152 — request the token's permissions EXPLICITLY instead of relying
          # on the action's default (inherit ALL installation permissions). Five
          # identical push failures (eva#146 ×2, eva#151 ×3) proved the default
          # mint does NOT carry `workflows: write` to the token even though the
          # App-level grant (2026-05-22) shows accepted on the installation with no
          # pending banner — so the agent's `git push` of a `.github/workflows/**`
          # diff is refused ("refusing to allow a GitHub App to create or update
          # workflow without workflows permission"). GitHub only surfaces the
          # recently-added `workflows` permission on the minted token when it is
          # requested explicitly; naming it here fixes that.
          #
          # This list MUST enumerate EVERY permission the downstream steps use —
          # once any permission-* input is set the token carries ONLY the listed
          # ones, no longer the full installation set:
          #   contents:write      — checkout + agent `git push` (branch + files)
          #   workflows:write      — agent push of `.github/workflows/**` diffs (the fix)
          #   issues:write         — Claim/Release: label create/edit + issue comments
          #   pull-requests:write  — agent `gh pr create` / `gh pr comment`
          #   metadata:read        — Claim's `gh api .../collaborators/.../permission`
          # Explicitly requesting `workflows` also self-diagnoses eva#152's
          # hypothesis 1: if the install grant is not actually live server-side,
          # this mint FAILS LOUDLY here (can't request a permission the
          # installation lacks) instead of the silent push refusal downstream.
          permission-contents: write
          permission-workflows: write
          permission-issues: write
          permission-pull-requests: write
          permission-metadata: read

      - name: Set auth token
        id: auth
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          PAT_TOKEN: ${{ secrets.EVA_PAT_GITHUB_TOKEN }}
        run: |
          # No `pull_request` event here (issues / repository_dispatch only), so
          # the App token is NOT subject to the workflow-boundary scope downgrade
          # that forces eva-review-pr onto a PAT — use the App token directly.
          if [ -n "$APP_TOKEN" ]; then
            echo "token=$APP_TOKEN" >> "$GITHUB_OUTPUT"
            echo "Using App token — PR will be authored by ievo-eva[bot]"
          else
            echo "token=$PAT_TOKEN" >> "$GITHUB_OUTPUT"
            echo "Using PAT fallback (USE_GITHUB_APP != true) — PR authored by the PAT owner"
          fi

      - name: Resolve issue context
        id: ctx
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_REPO: ${{ github.event.client_payload.repo }}
          DISPATCH_ISSUE: ${{ github.event.client_payload.issue_number }}
          ISSUE_NUMBER_FROM_EVENT: ${{ github.event.issue.number }}
        run: |
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            REPO="$DISPATCH_REPO"
            ISSUE_NUM="$DISPATCH_ISSUE"
          else
            REPO="${{ github.repository }}"
            ISSUE_NUM="$ISSUE_NUMBER_FROM_EVENT"
          fi
          if [ -z "$REPO" ] || [ -z "$ISSUE_NUM" ]; then
            echo "Missing repo or issue number, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "repo=$REPO"
            echo "issue_number=$ISSUE_NUM"
            echo "skip=false"
          } >> "$GITHUB_OUTPUT"

      # Claim the issue (approved -> eva-implementing) and enforce a best-effort
      # concurrency cap. All gh calls authenticate as the Eva App (ievo-eva[bot])
      # so label edits and the later PR are attributed to the App, not the operator.
      - name: Claim issue + rate-limit
        id: claim
        if: steps.ctx.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.auth.outputs.token }}
          REPO: ${{ steps.ctx.outputs.repo }}
          ISSUE_NUM: ${{ steps.ctx.outputs.issue_number }}
          MAX_INFLIGHT: ${{ vars.EVA_MAX_INFLIGHT || '3' }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          APPROVED_BY: ${{ github.event.sender.login }}
        run: |
          # eva#132 — PRECISE trust re-verification for the SELF-AUTHORED
          # (ievo-eva[bot]) issues:[labeled] path. The job `if:` only coarsely
          # admitted (sender.type==User OR the App); confirm here that the
          # `approved` sender is actually trusted, because the webhook carries no
          # sender-association field. Trusted = the Eva App itself (skeptic-mode
          # self-approve), OR a human with admin/write on the repo (a MEMBER/OWNER
          # able to apply labels in this org — one-click adoption). Fail-safe:
          # refuse (skip) on anything less. Consuming workflow gates on trust.
          if [ "$EVENT_NAME" = "issues" ] && [ "$ISSUE_AUTHOR" = "ievo-eva[bot]" ]; then
            if [ "$APPROVED_BY" = "ievo-eva[bot]" ]; then
              # App self-approve. NEVER allowed on eva's OWN repo — Eva must not
              # autonomously build her own automation (eva#132 answer #6). The
              # Router already holds eva-repo bot issues; this is belt-and-
              # suspenders at the consuming workflow. A human unlock (sender is a
              # MEMBER/OWNER, handled below) IS still allowed for eva.
              if [ "$REPO" = "ievo-ai/eva" ]; then
                echo "Refusing App self-approve on ievo-ai/eva (eva-self exception, fail-safe)."
                echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
              fi
              echo "Self-approved by the Eva App — trusted (skeptic-mode self-approve)."
            else
              PERM=$(gh api "repos/$REPO/collaborators/$APPROVED_BY/permission" \
                --jq '.permission' 2>/dev/null || echo "none")
              case "$PERM" in
                admin|write)
                  echo "approved by $APPROVED_BY ($PERM) — trusted human unlock." ;;
                *)
                  echo "approved sender $APPROVED_BY lacks write ($PERM) — refusing (fail-safe)."
                  echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
              esac
            fi
          fi

          LABELS=$(gh issue view "$ISSUE_NUM" --repo "$REPO" --json labels \
            --jq '[.labels[].name] | join(" ")')

          # Already claimed by a prior (possibly duplicate) event → no-op.
          case " $LABELS " in
            *" eva-implementing "*)
              echo "Issue already claimed (eva-implementing present), skipping"
              echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac

          # No `approved` label → router didn't clear it, or it was already
          # handled/removed. Fail safe: do nothing.
          case " $LABELS " in
            *" approved "*) : ;;
            *)
              echo "No 'approved' label present, skipping"
              echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac

          # eva#146 — `approved` is present, so a member (or the Router) has cleared
          # the operator block. Strip `needs-operator` NOW, BEFORE the rate-limit
          # branch below: a build that gets deferred for a free slot is already
          # unblocked (post-eva#144 the queue drains it within seconds), so it must
          # not keep the umbrella label. Best-effort + its own command — the label
          # may be absent (a straight-to-`approved` issue never held), and a
          # missing-label removal must not fail the claim.
          gh issue edit "$ISSUE_NUM" --repo "$REPO" \
            --remove-label needs-operator 2>/dev/null || true

          # Best-effort rate-limit: cap concurrent in-flight builds. This issue
          # still carries `approved` (not yet swapped), so it is not self-counted.
          INFLIGHT=$(gh issue list --repo "$REPO" --label eva-implementing \
            --state open --json number --jq 'length')
          if [ "$INFLIGHT" -ge "$MAX_INFLIGHT" ]; then
            gh issue comment "$ISSUE_NUM" --repo "$REPO" --body \
              "Eva implement is rate-limited ($INFLIGHT builds in flight, max $MAX_INFLIGHT). Deferred — remove and re-add the \`approved\` label to retry once a slot frees (GitHub won't re-fire on an already-present label)."
            echo "Rate-limited ($INFLIGHT >= $MAX_INFLIGHT), skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # Claim: swap approved -> eva-implementing.
          gh label create eva-implementing --repo "$REPO" \
            --description "Eva is building this issue" --color "1d76db" 2>/dev/null || true
          gh issue edit "$ISSUE_NUM" --repo "$REPO" \
            --remove-label approved --add-label eva-implementing
          echo "Claimed #$ISSUE_NUM"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      # Per-issue model/effort escalation (eva#172). Precedence: issue LABEL >
      # repo VARIABLE > workflow DEFAULT. Only whitelisted literals ever reach
      # the CLI — a `model:*`/`effort:*` label whose value is not on the
      # whitelist is IGNORED (never interpolated), which closes the
      # shell-injection surface the issue's guardrail calls out and keeps the
      # `--model`/`--effort` operands a fixed set of constants. Labels are
      # collaborator-only (same trust boundary as `approved`), so this is not an
      # external cost-escalation vector. With no model/effort label present this
      # resolves to exactly the eva#161 behaviour (var || default), byte-for-byte.
      - name: Resolve model + effort
        id: resolve
        if: steps.claim.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.auth.outputs.token }}
          REPO: ${{ steps.ctx.outputs.repo }}
          ISSUE_NUM: ${{ steps.ctx.outputs.issue_number }}
          VAR_MODEL: ${{ vars.EVA_MODEL_IMPLEMENT }}
          VAR_EFFORT: ${{ vars.EVA_EFFORT_IMPLEMENT }}
          DEFAULT_MODEL: opus
          DEFAULT_EFFORT: high
        run: |
          # Newline-free single-value extraction (robust to label names with
          # spaces): take the FIRST model:*/effort:* label if any. A transient
          # gh/API failure degrades GRACEFULLY to var||default (`|| echo '[]'`) —
          # pre-#172 the model/effort were pure GHA expressions with zero API
          # calls, so a hiccup could never fail this build; keep it that way
          # rather than aborting an otherwise-healthy build to operator triage.
          LJSON=$(gh issue view "$ISSUE_NUM" --repo "$REPO" --json labels --jq '[.labels[].name]' 2>/dev/null || echo '[]')
          MODEL_LABEL=$(printf '%s' "$LJSON" | jq -r 'map(select(startswith("model:"))) | first // ""')
          EFFORT_LABEL=$(printf '%s' "$LJSON" | jq -r 'map(select(startswith("effort:"))) | first // ""')

          # Display-safe forms for the notice comment below: strip backticks so an
          # unrecognized label value (collaborator-set, but still untrusted text)
          # can never break out of the inline-code span it is rendered in — no
          # markdown/@-mention spoofing in a comment that looks Eva-authored. The
          # resolved MODEL/EFFORT operands never use these (they are fixed literals
          # from the whitelist), so this only affects human-readable output.
          SAFE_MODEL_LABEL=$(printf '%s' "$MODEL_LABEL" | tr -d '`')
          SAFE_EFFORT_LABEL=$(printf '%s' "$EFFORT_LABEL" | tr -d '`')

          WARN=""
          # --- model: whitelist opus|fable (label > var > default) ---
          case "$MODEL_LABEL" in
            "")           MODEL="${VAR_MODEL:-$DEFAULT_MODEL}" ;;
            model:opus)   MODEL="opus" ;;
            model:fable)  MODEL="fable" ;;
            *)            MODEL="${VAR_MODEL:-$DEFAULT_MODEL}"
                          WARN="${WARN}- Ignored unrecognized \`$SAFE_MODEL_LABEL\` (model whitelist: \`model:opus\`, \`model:fable\`). Using \`$MODEL\`."$'\n' ;;
          esac
          # --- effort: whitelist low|medium|high|xhigh|max (label > var > default) ---
          case "$EFFORT_LABEL" in
            "")                                                        EFFORT="${VAR_EFFORT:-$DEFAULT_EFFORT}" ;;
            effort:low|effort:medium|effort:high|effort:xhigh|effort:max) EFFORT="${EFFORT_LABEL#effort:}" ;;
            *)                                                         EFFORT="${VAR_EFFORT:-$DEFAULT_EFFORT}"
                          WARN="${WARN}- Ignored unrecognized \`$SAFE_EFFORT_LABEL\` (effort whitelist: \`effort:low|medium|high|xhigh|max\`). Using \`$EFFORT\`."$'\n' ;;
          esac

          echo "Resolved model=$MODEL effort=$EFFORT (model_label='$MODEL_LABEL' effort_label='$EFFORT_LABEL')"
          {
            echo "model=$MODEL"
            echo "effort=$EFFORT"
          } >> "$GITHUB_OUTPUT"

          # Surface a whitelist miss on the issue so the operator sees why the
          # label had no effect (best-effort — never fail the build on this).
          if [ -n "$WARN" ]; then
            gh issue comment "$ISSUE_NUM" --repo "$REPO" --body \
              "$(printf 'Eva model-escalation notice:\n%s' "$WARN")" || true
          fi

      - name: Checkout target repo
        if: steps.claim.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.ctx.outputs.repo }}
          token: ${{ steps.auth.outputs.token }}
          fetch-depth: 0

      - name: Configure git identity
        if: steps.claim.outputs.skip != 'true'
        run: |
          git config --global user.name "iEVO Eva"
          git config --global user.email "noreply@ievo.ai"

      # Polyglot: the target repo may not be Python (cli/eva are uv projects, but
      # skills/marketplace/agents/ievo.ai are markdown/yaml/static). Only run the
      # Python toolchain when the checked-out target actually has a pyproject.toml;
      # otherwise uv sync would abort before the agent runs. Non-Python repos get
      # no managed toolchain — the agent installs whatever the repo's own gate
      # needs (e.g. pre-commit) via Bash, per the generalized prompt.
      - name: Detect project type
        id: detect
        if: steps.claim.outputs.skip != 'true'
        run: |
          if [ -f pyproject.toml ]; then
            echo "python=true" >> "$GITHUB_OUTPUT"
            echo "Target is a Python project (pyproject.toml present)."
          else
            echo "python=false" >> "$GITHUB_OUTPUT"
            echo "Target is NOT a Python project — skipping the uv toolchain."
          fi

      - name: Set up Python 3.13
        if: steps.claim.outputs.skip != 'true' && steps.detect.outputs.python == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        if: steps.claim.outputs.skip != 'true' && steps.detect.outputs.python == 'true'
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        if: steps.claim.outputs.skip != 'true' && steps.detect.outputs.python == 'true'
        # Prefer the dev group; fall back to a plain sync if the project defines
        # no dev group, so a Python repo with a different layout still installs.
        run: uv sync --group dev 2>/dev/null || uv sync

      # --- iEvo plugin dogfooding (eva#158) -------------------------------------
      # Eva dogfoods her own product (the ievo plugin in ievo-ai/skills) inside her
      # autonomous agents: /ievo:deep-review before the PR, /ievo:evolution to
      # capture lessons from failures, /ievo:feedback on plugin malfunction. The
      # prompt drives WHEN each fires; these two steps make the plugin + lesson
      # store available. Both are DORMANT until the operator sets repo variable
      # EVA_IEVO_PLUGIN_ENABLED=true (same dormant-by-default pattern as
      # EVA_IMPLEMENT_ENABLED) — with the flag unset the workflow is byte-for-byte
      # unchanged from before.
      #
      # DELIVERY MECHANISM (operator Q2 — verified against current docs +
      # claude-code-action source, 2026-07-04; documented here as required):
      #   - The action ALSO exposes native `plugins` / `plugin_marketplaces` inputs,
      #     but its installPlugins() THROWS on any add/install error and is awaited
      #     BEFORE the agent runs — so a transient marketplace/clone failure via
      #     those inputs would fail the whole build. That violates operator Q5
      #     ("plugin install failure must not fail the build"). So we do NOT use them.
      #   - Instead we install the plugin here in a `continue-on-error` step (so a
      #     failure is isolated — the build proceeds plugin-free) into the user
      #     scope (~/.claude). The action's own `claude` invocation then PICKS IT UP:
      #     its setup-claude-code-settings shallow-MERGES the `settings` input over
      #     the existing ~/.claude/settings.json (preserving the `enabledPlugins`
      #     key written by `claude plugin install`), and `-p`/print mode loads
      #     installed marketplace plugins + their /name skills (both documented).
      #   - `claude plugin marketplace add` clones ievo-ai/skills LIVE each run, so
      #     this is install-fresh-at-run-start by construction (the "живая версия"
      #     requirement — ephemeral runners, always the latest release).
      - name: Install iEvo plugin (dogfood, best-effort)
        id: ievo_plugin
        if: steps.claim.outputs.skip != 'true' && vars.EVA_IEVO_PLUGIN_ENABLED == 'true'
        continue-on-error: true   # operator Q5: a plugin failure must NEVER fail the build
        env:
          # plugin subcommands are local git/fs ops (no model calls), but pass the
          # token so `claude` never refuses to run for lack of auth.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          # install-fresh-at-run-start: latest CLI + a live clone of the marketplace.
          # `timeout` bounds each network op so a hang can't eat the 50-min budget.
          READY=false
          if npm install -g @anthropic-ai/claude-code \
             && timeout 300 claude plugin marketplace add ievo-ai/skills \
             && timeout 300 claude plugin install ievo@ievo-skills \
             && claude plugin list 2>/dev/null | grep -qi 'ievo'; then
            READY=true
            echo "iEvo plugin installed + enabled (user scope) — skills available to the agent."
          else
            echo "iEvo plugin unavailable this run — the agent proceeds WITHOUT it (degraded, operator Q5)."
          fi
          echo "ready=$READY" >> "$GITHUB_OUTPUT"

      # READ path for Eva's evolution store (operator Q1 — mandatory). The store is
      # Eva-side (ievo-ai/eva), NOT the target repo, so pull it via the API at main
      # (the working tree is $TARGET_REPO). Best-effort: an empty/missing store is
      # fine and must not fail the build. Also seed the WRITE-path capture file the
      # agent appends lessons to (uploaded as an artifact after the run).
      - name: Load Eva evolution store (best-effort)
        id: evo_store
        if: steps.claim.outputs.skip != 'true' && vars.EVA_IEVO_PLUGIN_ENABLED == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          STORE_FILE="$RUNNER_TEMP/eva-evolution-store.md"
          CAPTURE_FILE="$RUNNER_TEMP/eva-evolution-capture.md"
          if gh api "repos/ievo-ai/eva/contents/agent/memory/evolution/lessons.md?ref=main" \
               --jq '.content' 2>/dev/null | base64 -d > "$STORE_FILE" 2>/dev/null \
             && [ -s "$STORE_FILE" ]; then
            echo "Loaded Eva evolution store ($(wc -l < "$STORE_FILE") lines)."
          else
            echo "No Eva evolution store yet (or fetch failed) — starting empty." > "$STORE_FILE"
          fi
          : > "$CAPTURE_FILE"
          {
            echo "store=$STORE_FILE"
            echo "capture=$CAPTURE_FILE"
          } >> "$GITHUB_OUTPUT"

      # CONSTRAINT: eva-implement.md must never contain the literal string
      # "EVA_IMPLEMENT_PROMPT_EOF" on a line by itself (heredoc delimiter).
      #
      # The prompt lives in EVA (this workflow's repo), but the workspace is the
      # TARGET repo checkout (cross-repo build → the working tree is e.g. cli,
      # which has no eva prompt). Fetch the prompt from eva via the API at the
      # commit this workflow is running, NOT from the working tree.
      - name: Load implement prompt
        if: steps.claim.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.auth.outputs.token }}
          PROMPT_REPO: ${{ github.repository }}
          PROMPT_REF: ${{ github.sha }}
        run: |
          PROMPT=$(gh api \
            "repos/$PROMPT_REPO/contents/.github/prompts/eva-implement.md?ref=$PROMPT_REF" \
            --jq '.content' | base64 -d)
          if [ -z "$PROMPT" ]; then
            echo "::error::eva-implement.md not found in $PROMPT_REPO@$PROMPT_REF"; exit 1
          fi
          if printf '%s\n' "$PROMPT" | grep -qxF 'EVA_IMPLEMENT_PROMPT_EOF'; then
            echo "::error::eva-implement.md contains the heredoc delimiter"; exit 1
          fi
          {
            echo "IMPLEMENT_PROMPT<<EVA_IMPLEMENT_PROMPT_EOF"
            printf '%s\n' "$PROMPT"
            echo "EVA_IMPLEMENT_PROMPT_EOF"
          } >> "$GITHUB_ENV"

      - name: Run Implement agent
        if: steps.claim.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # eva#151 root cause: without this input the action performs its default
          # OIDC exchange and configures the git credential with the CLAUDE GitHub
          # App's token — overriding the checkout-persisted ievo-eva token. That
          # app has contents:write (so ordinary branch pushes always worked) but
          # NOT workflows — so every `.github/workflows/**` push was refused no
          # matter what the ievo-eva mint carried (7 identical refusals across
          # eva#146/#151/#152). Passing OUR minted App token here makes the
          # agent's `git push` run as ievo-eva with the explicit permission set
          # from the Generate App token step (incl. workflows:write, #153).
          github_token: ${{ steps.auth.outputs.token }}
          show_full_output: true
          # eva-queue (the proactive heartbeat) dispatches implement-issue with
          # the App token, so the triggering actor is ievo-eva[bot]. The action
          # rejects bot-initiated runs by default — allow OUR bot. Trust is NOT
          # weakened: the real gate is the job-level author_association
          # MEMBER/OWNER check + EVA_IMPLEMENT_ENABLED, not the dispatcher.
          # (The reactive forwarder dispatches via the PAT = a human actor, so it
          # never needed this; only the App-token queue path does.)
          allowed_bots: "ievo-eva"
          # `Skill` is appended ONLY when plugin dogfooding is enabled so the agent
          # may invoke the iEvo plugin's /ievo:* skills; with the flag unset the
          # tool list is byte-for-byte identical to before (eva#158).
          #
          # Model + effort (eva#161 runbook + eva#172 per-issue escalation): the
          # `Resolve model + effort` step above already applied the precedence
          # LABEL > repo VARIABLE (EVA_MODEL_IMPLEMENT / EVA_EFFORT_IMPLEMENT) >
          # DEFAULT (opus / high), whitelisting label values so only fixed
          # constants reach these operands. To switch the flow without a per-issue
          # label, set the repo/org Actions variable (empty → the default). A
          # collaborator can escalate ONE issue by labelling it `model:fable`
          # (optionally `effort:xhigh`); the Router may also auto-apply
          # `model:fable` for narrow reasoning-heavy tasks. `--effort` is a real
          # per-session CLI flag (docs: code.claude.com/docs/en/model-config#adjust-effort-level);
          # `high` is also the model-default effort for opus (Opus 4.8), so the
          # default is behavior-preserving, not a silent uplift.
          claude_args: |
            --model ${{ steps.resolve.outputs.model }}
            --effort ${{ steps.resolve.outputs.effort }}
            --allowedTools "Bash,Edit,Read,Write,Glob,Grep,WebFetch,WebSearch${{ vars.EVA_IEVO_PLUGIN_ENABLED == 'true' && ',Skill' || '' }}"
          settings: |
            {
              "env": {
                "GH_TOKEN": "${{ steps.auth.outputs.token }}",
                "TARGET_REPO": "${{ steps.ctx.outputs.repo }}",
                "TARGET_ISSUE": "${{ steps.ctx.outputs.issue_number }}",
                "EVA_IEVO_PLUGIN_READY": "${{ steps.ievo_plugin.outputs.ready }}",
                "EVA_EVOLUTION_STORE": "${{ steps.evo_store.outputs.store }}",
                "EVA_EVOLUTION_CAPTURE": "${{ steps.evo_store.outputs.capture }}"
              }
            }
          prompt: ${{ env.IMPLEMENT_PROMPT }}

      # WRITE path (operator Q1, per-run artifact): upload the lessons the agent
      # captured this run for later consolidation into agent/memory/evolution/
      # lessons.md. `always()` so lessons about a FAILED build are captured too;
      # best-effort so a missing/empty capture never affects the build outcome.
      - name: Upload evolution capture (best-effort)
        if: always() && steps.claim.outputs.skip != 'true' && vars.EVA_IEVO_PLUGIN_ENABLED == 'true' && steps.evo_store.outputs.capture != ''
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: eva-evolution-capture-${{ steps.ctx.outputs.issue_number }}
          path: ${{ steps.evo_store.outputs.capture }}
          if-no-files-found: ignore
          retention-days: 90

      # Deterministic post-check (eva#170): a GREEN agent step must have produced
      # one of the contract outcomes — an eva-impl/* PR referencing this issue,
      # or a documented exit path that released the claim label. Run 28705052982
      # proved the gap: the agent ended its turn with background subagents still
      # pending, the process died with them, and the step still reported success
      # (`is_error: false`) — no PR, claim dangling, queue silently stalled. The
      # `Release claim on failure` step below cannot catch that (it is gated
      # `failure()`), so this step verifies the contract on the SUCCESS path and
      # fails the run loudly when it was not met (same fail-loudly philosophy as
      # eva#160). Implicit success() gate: if the agent step already failed, the
      # existing failure path owns the cleanup and this step is skipped.
      - name: Verify implement contract
        id: contract
        if: steps.claim.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ steps.auth.outputs.token }}
          REPO: ${{ steps.ctx.outputs.repo }}
          ISSUE_NUM: ${{ steps.ctx.outputs.issue_number }}
        run: |
          # Outcome 1: a PR on an eva-impl/* branch references this issue in its
          # title or body (the prompt mandates "(#N)" in the title and
          # "Closes #N" in the body). OPEN or MERGED only — a CLOSED-unmerged
          # PR from a previous failed attempt must not satisfy a retry. (A stale
          # MERGED PR on a reopened issue could in theory false-satisfy this;
          # accepted — the dominant failure class is NO PR at all.)
          # Same-repo head only (isCrossRepository == false): a fork PR can name
          # its branch eva-impl/* and mention #N, but cannot be the build's PR —
          # without this filter such a PR would silently suppress the alarm.
          # (Deliberately NOT filtered by author: on the PAT fallback path the
          # PR author is the PAT owner, not ievo-eva[bot].)
          #
          # NOTE the asymmetry with `Verify fix contract`'s `|| fallback`s: the
          # gh calls here have NO error-swallowing on purpose. A transient API
          # failure must abort this step to the generic `Release claim on
          # failure` path — a fallback that reads as "no PR found" would issue a
          # false 'silent stall' verdict against a possibly healthy build.
          gh pr list --repo "$REPO" --state all --limit 100 \
            --json number,state,headRefName,title,body,isCrossRepository > /tmp/eva-impl-prs.json
          PR_MATCH=$(jq --arg n "$ISSUE_NUM" \
            '[.[] | select((.state == "OPEN" or .state == "MERGED")
                           and (.isCrossRepository | not)
                           and (.headRefName | startswith("eva-impl/"))
                           and (((.title // "") + " " + (.body // "")) | test("#\($n)([^0-9]|$)")))
             | .number]' /tmp/eva-impl-prs.json)
          if [ "$(printf '%s' "$PR_MATCH" | jq 'length')" -gt 0 ]; then
            echo "Contract met: eva-impl/* PR(s) $(printf '%s' "$PR_MATCH" | jq -c .) reference #$ISSUE_NUM."
            exit 0
          fi
          # Outcome 2: a documented exit path released the claim label (open
          # questions → needs-discussion; not actionable, rebase conflict, main
          # kept moving, or PR-create failure → triage; all + needs-operator).
          # The agent left the issue in an operator-visible state on purpose.
          LABELS=$(gh issue view "$ISSUE_NUM" --repo "$REPO" --json labels \
            --jq '[.labels[].name] | join(" ")')
          case " $LABELS " in
            *" eva-implementing "*) : ;;
            *)
              echo "Contract met: claim label already released (documented exit path)."
              exit 0 ;;
          esac
          # Neither: the eva#170 silent-stall class. Remediate exactly like
          # `Release claim on failure` (all best-effort so every command runs),
          # then fail the job so the run can never read as green.
          echo "remediated=true" >> "$GITHUB_OUTPUT"
          gh label create needs-operator --repo "$REPO" \
            --description "Pipeline blocked on the human operator to unblock" \
            --color "e11d21" 2>/dev/null || true
          gh issue edit "$ISSUE_NUM" --repo "$REPO" \
            --remove-label eva-implementing --add-label triage --add-label needs-operator 2>/dev/null || true
          gh issue comment "$ISSUE_NUM" --repo "$REPO" --body \
            "Eva's implement run ended without opening a PR and without releasing the claim — the eva#170 silent-stall class, whatever the specific cause (a turn ended while background work was still pending, or a stop that skipped the claim-release commands). Released the \`eva-implementing\` claim (freed a build slot) and moved to \`triage\` + \`needs-operator\` for operator review. If a pushed \`eva-impl/*\` branch exists it may hold a partial build — verify before reusing. Re-apply \`approved\` to retry." || true
          echo "::error::Implement contract violated: no OPEN/MERGED eva-impl/* PR references #$ISSUE_NUM and the claim label was still present. Claim released, issue moved to triage + needs-operator."
          exit 1

      # Release the claim if the build crashed/failed AFTER claiming. Without
      # this, a failed run strands the issue in `eva-implementing` forever, and
      # MAX_INFLIGHT such stuck claims permanently block all future builds. Move
      # to `triage` (NOT back to `approved` — that would re-fire `labeled` and
      # loop) and flag the operator. Only runs when we actually claimed — and
      # NOT when `Verify implement contract` already remediated (it releases the
      # claim itself before failing the job; a second pass would double-comment).
      - name: Release claim on failure
        if: failure() && steps.claim.outputs.skip == 'false' && steps.contract.outputs.remediated != 'true'
        env:
          GH_TOKEN: ${{ steps.auth.outputs.token }}
          REPO: ${{ steps.ctx.outputs.repo }}
          ISSUE_NUM: ${{ steps.ctx.outputs.issue_number }}
        run: |
          # Move to `triage` (operator review) and flag it in the operator's
          # cross-repo inbox with `needs-operator` (eva#146) — a failed build is a
          # state only the operator can unblock (re-apply `approved`). Create the
          # label if missing (same lazy create-if-missing used everywhere).
          gh label create needs-operator --repo "$REPO" \
            --description "Pipeline blocked on the human operator to unblock" \
            --color "e11d21" 2>/dev/null || true
          gh issue edit "$ISSUE_NUM" --repo "$REPO" \
            --remove-label eva-implementing --add-label triage --add-label needs-operator 2>/dev/null || true
          gh issue comment "$ISSUE_NUM" --repo "$REPO" --body \
            "Eva's implement run failed or was interrupted after claiming this issue. Released the \`eva-implementing\` claim (freed a build slot) and moved to \`triage\` + \`needs-operator\` for operator review. Re-apply \`approved\` to retry." || true
