# Eva — PR Gatekeeper
# Reviews PRs via Claude Code CLI, auto-merges on approval.
# Triggers:
#   - repository_dispatch (cross-repo, child repos dispatch when their tests pass)
#   - workflow_run on Tests (Eva self-review when CI runs on a non-draft PR)
#   - pull_request: ready_for_review (PR transitions from draft → open; CI
#     already ran while it was a draft, no new push to retrigger workflow_run)

name: "Eva: Review PR"

on:
  # Cross-repo: child repos dispatch here when tests pass
  repository_dispatch:
    types: [review-pr]

  # Self-review: Eva's own tests pass on a PR
  workflow_run:
    workflows: ["Tests"]
    types: [completed]

  # Self-review: PR transitions from draft to ready-for-review. The
  # workflow_run path above won't fire on this transition (no new CI run is
  # triggered when a PR's draft flag flips). Without this, draft-then-ready
  # PRs sit unreviewed unless the operator pushes an empty commit to force CI.
  pull_request:
    types: [ready_for_review]

# Workflow-level permissions (for the automatic GITHUB_TOKEN if used).
#
# IMPORTANT: this workflow's actual auth flows through the `ievo-eva`
# GitHub App via `actions/create-github-app-token@v1` (preferred) or
# falls back to `EVA_PAT_GITHUB_TOKEN` PAT. The App installation in
# `ievo-ai` org MUST have `workflows: write` permission — without it,
# `gh api repos/X/pulls/N` returns 403 "Resource not accessible by
# integration" whenever the PR being reviewed modifies any file under
# `.github/workflows/`. This was the root cause of the 2026-05-22 spate
# of Eva-review-pr failures on workflow-touching PRs. App permission
# panel: https://github.com/organizations/ievo-ai/settings/apps/ievo-eva/permissions
# Installation review URL: https://github.com/organizations/ievo-ai/settings/installations/113079602
permissions:
  contents: write
  pull-requests: write
  issues: read

concurrency:
  group: eva-review-${{ github.event.client_payload.repo || github.repository }}-${{ github.event.client_payload.pr_number || github.event.pull_request.number || github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  review:
    name: "Eva: Code Review"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # SECURITY: trust filter + loop prevention.
    #
    # 2026-05-22 hot-fix (godfather task #41 Vector A): block external /
    # fork PRs from triggering Eva's auto-review path. Previously, ANY
    # GitHub user could fork ievo-ai/eva, open a malicious PR, and the
    # workflow_run path would inherit secrets + elevated permissions
    # (known GHA security footgun) → Claude review with default-APPROVE
    # → gh pr merge --auto → malicious code in main.
    #
    # Defense layers (this expression is layer 1; runtime check in
    # Resolve PR context step is layer 2 for events that can't be fully
    # filtered at expression time):
    #
    #   workflow_run / pull_request — require head repository to be in
    #     ievo-ai org (rejects all fork-based PRs at the gate)
    #   repository_dispatch — unchanged; cross-repo trusted callers
    #
    # eva-implement carve-out (eva#106 Phase 1b): eva-implement.yml authors its
    # PRs as the `ievo-eva` machine USER (EVA_PAT) so the App can approve them
    # (App `ievo-eva[bot]` ≠ user `ievo-eva` = different principals). But that
    # means Tests on those PRs are triggered by `ievo-eva`, which the loop filter
    # below would otherwise reject. Carve out ONLY branches matching `eva-impl/*`
    # (the prefix eva-implement uses) so Eva can review her own implement PRs.
    # Safe: (1) head_repository.owner.login == 'ievo-ai' still rejects forks;
    # (2) only org members can push an `eva-impl/*` branch to ievo-ai/eva;
    # (3) no loop — eva-review only reviews + merges these PRs, it never pushes
    # to them, so there is nothing to re-trigger; (4) the sensitive-path gate +
    # the runtime Tests-green/draft checks below still apply unchanged.
    if: >
      (github.event_name == 'repository_dispatch' &&
       github.event.client_payload.triggered_by != 'ievo-eva' &&
       github.event.client_payload.triggered_by != 'github-actions[bot]') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.head_repository.owner.login == 'ievo-ai' &&
       (
         (github.event.workflow_run.triggering_actor.login != 'ievo-eva' &&
          github.event.workflow_run.triggering_actor.login != 'github-actions[bot]')
         ||
         startsWith(github.event.workflow_run.head_branch, 'eva-impl/')
       )) ||
      (github.event_name == 'pull_request' &&
       github.event.action == 'ready_for_review' &&
       github.event.pull_request.head.repo.owner.login == 'ievo-ai' &&
       github.event.pull_request.user.login != 'ievo-eva' &&
       github.event.pull_request.user.login != 'github-actions[bot]')

    steps:
      # --- Auth ---
      - name: Generate App token
        if: vars.USE_GITHUB_APP == 'true'
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ievo-ai

      - name: Set auth token
        id: auth
        env:
          EVENT_NAME: ${{ github.event_name }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          PAT_TOKEN: ${{ secrets.EVA_PAT_GITHUB_TOKEN }}
        run: |
          # Token selection rationale (2026-05-23):
          #
          # `pull_request` event on a workflow-modifying PR causes GitHub
          # to restrict the App installation token's effective scope at
          # the workflow boundary, regardless of installation-level
          # permissions (even with `workflows: write` granted). Result:
          # `gh api repos/X/pulls/N` returns 403 "Resource not accessible
          # by integration". Empirically confirmed:
          #   - PR #54 (modifies eva-research.yml), run 26327402101
          #     2026-05-23T07:52Z — failed 403 even after
          #     ievo-eva App's workflows:write grant on 2026-05-22T17:01Z
          #
          # PATs are user-bound, not subject to App-installation-scope
          # downgrades. Force PAT specifically for `pull_request` events
          # to avoid the 403. Other paths (workflow_run, repository_
          # dispatch) keep App-token-preferred behavior — they run from
          # main and don't hit the workflow-modifying-PR restriction.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "token=$PAT_TOKEN" >> "$GITHUB_OUTPUT"
            echo "Using PAT (pull_request event — App token gets restricted on workflow-modifying PRs)"
          elif [ -n "$APP_TOKEN" ]; then
            echo "token=$APP_TOKEN" >> "$GITHUB_OUTPUT"
            echo "Using App token"
          else
            echo "token=$PAT_TOKEN" >> "$GITHUB_OUTPUT"
            echo "Using PAT (App token unavailable)"
          fi

      # --- Resolve PR context (dispatch vs workflow_run vs pull_request) ---
      - name: Resolve PR context
        id: ctx
        env:
          GH_TOKEN: ${{ steps.auth.outputs.token }}
          DISPATCH_REPO: ${{ github.event.client_payload.repo }}
          DISPATCH_PR: ${{ github.event.client_payload.pr_number }}
          WR_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER_FROM_EVENT: ${{ github.event.pull_request.number }}
        run: |
          EVENT="${{ github.event_name }}"
          if [ "$EVENT" = "repository_dispatch" ]; then
            REPO="$DISPATCH_REPO"
            PR_NUM="$DISPATCH_PR"
          elif [ "$EVENT" = "pull_request" ]; then
            REPO="${{ github.repository }}"
            PR_NUM="$PR_NUMBER_FROM_EVENT"
          else
            # workflow_run — find PR via the event payload's
            # `pull_requests[]` array (direct PR association from GitHub).
            # The legacy `head.sha == workflow_run.head_sha` lookup
            # fails for pull_request-triggered Tests because GitHub uses
            # the synthetic merge commit's SHA (not the PR's HEAD) in
            # workflow_run.head_sha — confirmed empirically PR #59
            # (2026-05-23T10:25Z): WR_SHA was 425d0525 (merge commit),
            # PR HEAD was da176238, lookup returned empty, review
            # skipped. Reading event JSON via jq avoids both the
            # merge-commit SHA issue and the GHA expression
            # `array[0].field` syntax limitations.
            REPO="${{ github.repository }}"
            PR_NUM=$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")
            if [ -z "$PR_NUM" ]; then
              # Fallback: legacy head_sha lookup (works for push events
              # or rare cases where pull_requests[] is empty in the
              # event payload)
              PR_NUM=$(gh api "repos/$REPO/pulls?state=open" \
                --jq ".[] | select(.head.sha == \"$WR_SHA\") | .number" \
                | head -1)
            fi
          fi

          if [ -z "$PR_NUM" ]; then
            echo "No PR found, skipping review"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Check if PR is draft (defense-in-depth — pull_request:ready_for_review
          # already filters by action, but a race could leave the PR re-drafted)
          DRAFT=$(gh api "repos/$REPO/pulls/$PR_NUM" --jq '.draft')
          if [ "$DRAFT" = "true" ]; then
            echo "PR is draft, skipping review"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # SECURITY: runtime trust filter (godfather task #41 Vector A
          # hot-fix, 2026-05-22). The job-level `if:` already rejects
          # fork PRs (head.repo.owner.login != 'ievo-ai'); this runtime
          # check re-verifies the same property in case the
          # repository_dispatch path slipped through (the job-level
          # filter doesn't gate that branch on head_repo_owner).
          #
          # 2026-05-22 (same day): the prior `author_association` strict
          # filter (MEMBER|OWNER|COLLABORATOR) was REMOVED — it produced
          # false negatives for trusted operators. The repository owner
          # (`rotnov`) opened PR #47 with author_association=CONTRIBUTOR
          # because GitHub's per-PR association value is computed per
          # PR, not per role — an OWNER who didn't directly commit-then-
          # PR can show as CONTRIBUTOR. Result: PR sat unreviewed,
          # operator had to admin-merge.
          #
          # The author_association filter was over-engineered anyway:
          # same-repo branch PRs implicitly require push access, which
          # GitHub only grants to trusted accounts (members + explicit
          # outside collaborators). If Layer 1 (head_repo_owner check)
          # passes, push access has already been verified by GitHub's
          # own auth. No additional author check needed here.
          HEAD_REPO_OWNER=$(gh api "repos/$REPO/pulls/$PR_NUM" --jq '.head.repo.owner.login')
          if [ "$HEAD_REPO_OWNER" != "ievo-ai" ]; then
            echo "PR head repo owner '$HEAD_REPO_OWNER' is not ievo-ai (likely a fork), skipping review"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # When triggered by pull_request:ready_for_review, Tests already
          # ran while the PR was a draft (or just ran on the latest push).
          # Either way we must verify Tests are GREEN on the current head
          # before reviewing — don't review code with broken tests.
          if [ "$EVENT" = "pull_request" ]; then
            HEAD_SHA=$(gh api "repos/$REPO/pulls/$PR_NUM" --jq '.head.sha')
            TESTS_CONCLUSION=$(gh api "repos/$REPO/commits/$HEAD_SHA/check-runs?check_name=Lint+%26+Test" \
              --jq '.check_runs[0].conclusion // "missing"')
            if [ "$TESTS_CONCLUSION" != "success" ]; then
              echo "Tests not green on head ($TESTS_CONCLUSION), skipping review"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          {
            echo "repo=$REPO"
            echo "pr_number=$PR_NUM"
            echo "skip=false"
          } >> "$GITHUB_OUTPUT"

      # --- Checkout target repo at PR head ---
      - name: Checkout PR
        if: steps.ctx.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.ctx.outputs.repo }}
          ref: refs/pull/${{ steps.ctx.outputs.pr_number }}/head
          token: ${{ steps.auth.outputs.token }}
          fetch-depth: 0

      # --- Fetch PR diff and metadata ---
      - name: Fetch PR details
        if: steps.ctx.outputs.skip != 'true'
        id: pr
        env:
          GH_TOKEN: ${{ steps.auth.outputs.token }}
          REPO: ${{ steps.ctx.outputs.repo }}
          PR_NUM: ${{ steps.ctx.outputs.pr_number }}
        run: |
          # Use local git diff to avoid GitHub API 20k-line limit
          BASE_BRANCH=$(gh api "repos/$REPO/pulls/$PR_NUM" --jq '.base.ref')
          git fetch origin "$BASE_BRANCH"
          git diff "origin/$BASE_BRANCH"...HEAD > /tmp/pr.diff

          gh api "repos/$REPO/pulls/$PR_NUM" \
            --jq '{title: .title, body: .body, user: .user.login, changed_files: .changed_files, additions: .additions, deletions: .deletions}' \
            > /tmp/pr-meta.json

          echo "large=false" >> "$GITHUB_OUTPUT"

      # --- Install Claude Code CLI ---
      - name: Setup Node.js
        if: steps.ctx.outputs.skip != 'true' && steps.pr.outputs.large != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code CLI
        if: steps.ctx.outputs.skip != 'true' && steps.pr.outputs.large != 'true'
        run: npm install -g @anthropic-ai/claude-code

      # --- Eva reviews via Claude Code CLI ---
      - name: Eva reviews the PR
        if: steps.ctx.outputs.skip != 'true' && steps.pr.outputs.large != 'true'
        id: review
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          # Build prompt file to avoid shell escaping issues
          META=$(cat /tmp/pr-meta.json)
          DIFF=$(head -c 500000 /tmp/pr.diff)

          cat > /tmp/prompt.txt <<'EOPROMPT'
          You are Eva, the mother agent of iEvo. Review this pull request.

          ## Instructions
          1. Read CLAUDE.md in this repo for project context and rules
          2. Evaluate: code quality, test coverage, security, style, docs
          3. Check for: bugs, missing tests, rule violations, breaking changes
          4. Your FIRST line must be exactly one of: APPROVE or REQUEST_CHANGES
          5. Then a line with just: ---
          6. Then your review comment (concise, actionable, max 500 chars)

          Format example:
          APPROVE
          ---
          Clean implementation. Tests cover all paths. Docs updated.
          EOPROMPT

          printf '\n\n## PR Metadata\n%s\n\n## Diff (first 100KB)\n%s' "$META" "$DIFF" >> /tmp/prompt.txt

          # Clear CLAUDECODE to avoid nested session issues
          unset CLAUDECODE

          REVIEW=$(cat /tmp/prompt.txt | claude -p --model opus --allowedTools "Bash(read-only),Read,Glob,Grep") || true

          # SAFETY (2026-05-23): on CLI failure, default to REQUEST_CHANGES
          # — operator decides. Previously defaulted to APPROVE which let
          # broken-Claude runs auto-merge garbage. Original line said:
          # "Auto-approving based on passing tests" — but passing Tests
          # only verifies lint+pytest, says nothing about whether the
          # change is correct, safe, or intended. APPROVE without an
          # actual review is rubber-stamping.
          if [ -z "$REVIEW" ]; then
            echo "decision=REQUEST_CHANGES" >> "$GITHUB_OUTPUT"
            {
              echo "comment<<EOFCOMMENT"
              echo "Eva could not complete review (Claude CLI returned empty or timed out)."
              echo ""
              echo "Defaulting to REQUEST_CHANGES so the PR doesn't auto-merge without a real review."
              echo "Operator: please review manually or re-run Eva via repository_dispatch."
              echo "EOFCOMMENT"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Decision extraction (godfather, 2026-06-02): we instruct Claude to
          # put APPROVE / REQUEST_CHANGES on the FIRST line, but it routinely
          # adds a sentence of preamble first. Reading only `head -1` then
          # mis-classified a clear APPROVE as a parse failure → REQUEST_CHANGES,
          # which (together with the sensitive gate) is why approved audits
          # never auto-merged. Instead, find an explicit STANDALONE decision
          # token anywhere in the output. Still strict: the line must be exactly
          # the token (so prose like "I cannot APPROVE this" does NOT match),
          # and an output with neither — or both (contradictory) — falls through
          # to the safe REQUEST_CHANGES default below. This fixes the parser; it
          # does NOT loosen the safety semantics.
          APPROVE_N=$(printf '%s\n' "$REVIEW" | grep -cE '^[[:space:]]*APPROVE[[:space:]]*$' || true)
          RC_N=$(printf '%s\n' "$REVIEW" | grep -cE '^[[:space:]]*REQUEST_CHANGES[[:space:]]*$' || true)
          if [ "${APPROVE_N:-0}" -ge 1 ] && [ "${RC_N:-0}" -eq 0 ]; then
            DECISION="APPROVE"
          elif [ "${RC_N:-0}" -ge 1 ] && [ "${APPROVE_N:-0}" -eq 0 ]; then
            DECISION="REQUEST_CHANGES"
          else
            DECISION="UNPARSEABLE"
          fi
          COMMENT=$(echo "$REVIEW" | sed '1,/^---$/d')

          # SAFETY (2026-05-23): on parse failure, default to REQUEST_CHANGES.
          # Previously defaulted to APPROVE, which let any malformed Claude
          # output trigger auto-merge. A parse failure is NOT an approval
          # signal — it means we don't know what Claude decided.
          if [ "$DECISION" != "APPROVE" ] && [ "$DECISION" != "REQUEST_CHANGES" ]; then
            DECISION="REQUEST_CHANGES"
            COMMENT="$(printf 'Eva could not parse her own review output (no standalone APPROVE or REQUEST_CHANGES line, or both present). Defaulting to REQUEST_CHANGES so the PR does NOT auto-merge. Raw Claude output below — operator decides.\n\n---\n\n%s' "$REVIEW")"
          fi

          echo "decision=$DECISION" >> "$GITHUB_OUTPUT"
          {
            echo "comment<<EOFCOMMENT"
            echo "$COMMENT"
            echo "EOFCOMMENT"
          } >> "$GITHUB_OUTPUT"

      # --- Post review to PR ---
      - name: Post review
        if: steps.ctx.outputs.skip != 'true' && steps.pr.outputs.large != 'true'
        env:
          GH_TOKEN: ${{ steps.auth.outputs.token }}
          REPO: ${{ steps.ctx.outputs.repo }}
          PR_NUM: ${{ steps.ctx.outputs.pr_number }}
          DECISION: ${{ steps.review.outputs.decision }}
          COMMENT: ${{ steps.review.outputs.comment }}
        run: |
          if [ "$DECISION" = "APPROVE" ]; then
            EVENT="APPROVE"
          else
            EVENT="REQUEST_CHANGES"
          fi

          BODY=$(printf '**Eva** reviewed this PR.\n\n%s\n\n---\n> Reviewed by Eva (meta-evolution agent)' "$COMMENT")

          # Post review — fall back to COMMENT if APPROVE fails (e.g. own PR)
          gh api "repos/$REPO/pulls/$PR_NUM/reviews" \
            --method POST \
            -f event="$EVENT" \
            -f body="$BODY" \
          || gh api "repos/$REPO/pulls/$PR_NUM/reviews" \
            --method POST \
            -f event="COMMENT" \
            -f body="$BODY (could not submit as $EVENT — likely own-PR restriction)"

      # --- Sensitive-path gate (godfather task #41, 2026-05-23) ---
      # Block auto-merge on PRs that touch Eva's own behavior or critical
      # platform infrastructure. Operator MUST manually merge those.
      #
      # Rationale: Eva approving Eva's own self-modifying PRs is a
      # single-reviewer loop. Mechanical fixes can auto-merge; behavioral
      # changes need a human in the loop.
      - name: Sensitive-path check
        id: sensitive
        if: steps.ctx.outputs.skip != 'true' && steps.pr.outputs.large != 'true' && steps.review.outputs.decision == 'APPROVE'
        env:
          GH_TOKEN: ${{ steps.auth.outputs.token }}
          REPO: ${{ steps.ctx.outputs.repo }}
          PR_NUM: ${{ steps.ctx.outputs.pr_number }}
        run: |
          # Get the list of files changed in this PR
          CHANGED=$(gh api "repos/$REPO/pulls/$PR_NUM/files" --paginate \
            --jq '.[].filename')

          # Patterns that require operator approval (no auto-merge).
          # Each pattern checked as a Bash glob prefix / substring.
          SENSITIVE_PATTERNS=(
            ".github/workflows/"      # any workflow file change
            "agent/ROLE.md"           # Eva's identity
            "agent/memory/"           # Eva's memory store
            "CLAUDE.md"               # project rules
            "src/eva/sources/"        # data source connectors (touch behavior)
            "src/eva/pipeline.py"     # main scan pipeline
            "src/eva/analysis/"       # pattern detection logic
            "src/eva/mutations/"      # mutation generator
            "researches/sources-index.md"   # research source list
            "researches/findings-backlog.md" # findings strategic layer
          )

          SENSITIVE_HITS=""
          while IFS= read -r f; do
            for pattern in "${SENSITIVE_PATTERNS[@]}"; do
              if [[ "$f" == *"$pattern"* ]]; then
                SENSITIVE_HITS="${SENSITIVE_HITS}- $f (matches: $pattern)"$'\n'
                break
              fi
            done
          done <<< "$CHANGED"

          # Routine research-audit exception (godfather, 2026-06-02):
          # researches/sources-index.md + findings-backlog.md are in the
          # sensitive list so non-routine edits get operator review — but that
          # ALSO blocked every daily `eva-research` audit (each one always
          # appends to both), so approved audits piled up needing manual merge.
          # Allow auto-merge for routine audits only: head branch matches
          # research/audit-* AND every changed file lives under researches/.
          # Any other edit to those strategic files (or any behavioral/workflow
          # path) still hits the operator-review gate below. The workflow_run
          # trust filter already blocks fork PRs from reaching this point.
          HEAD_REF=$(gh api "repos/$REPO/pulls/$PR_NUM" --jq '.head.ref')
          IS_AUDIT=false
          if [[ "$HEAD_REF" == research/audit-* ]]; then
            IS_AUDIT=true
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              if [[ "$f" != researches/* ]]; then IS_AUDIT=false; break; fi
            done <<< "$CHANGED"
          fi

          if [ "$IS_AUDIT" = "true" ]; then
            echo "is_sensitive=false" >> "$GITHUB_OUTPUT"
            echo "Routine research-audit PR ($HEAD_REF; all files under researches/) — auto-merge allowed despite researches/ being in the sensitive list"
          elif [ -n "$SENSITIVE_HITS" ]; then
            echo "is_sensitive=true" >> "$GITHUB_OUTPUT"
            echo "Sensitive paths touched — operator must manually merge:"
            printf '%s' "$SENSITIVE_HITS"
            {
              echo "hits<<EOFHITS"
              printf '%s' "$SENSITIVE_HITS"
              echo "EOFHITS"
            } >> "$GITHUB_OUTPUT"
          else
            echo "is_sensitive=false" >> "$GITHUB_OUTPUT"
            echo "No sensitive paths touched — auto-merge allowed"
          fi

      # --- Auto-merge on approval (only if not sensitive) ---
      - name: Auto-merge
        if: steps.ctx.outputs.skip != 'true' && steps.pr.outputs.large != 'true' && steps.review.outputs.decision == 'APPROVE' && steps.sensitive.outputs.is_sensitive == 'false'
        env:
          GH_TOKEN: ${{ steps.auth.outputs.token }}
          REPO: ${{ steps.ctx.outputs.repo }}
          PR_NUM: ${{ steps.ctx.outputs.pr_number }}
        run: |
          # This step runs after Tests complete, so required checks are green.
          # Try a direct merge first — it succeeds when the PR is already
          # mergeable (the common case). `gh pr merge --auto` ALONE silently
          # no-ops when there are no pending required checks (the PR is already
          # clean), which is why approved PRs used to sit open. Fall back to
          # --auto to QUEUE the merge if the PR is momentarily behind main or a
          # required check is still settling.
          gh pr merge "$PR_NUM" --repo "$REPO" --squash --delete-branch \
            || gh pr merge "$PR_NUM" --repo "$REPO" --auto --squash --delete-branch \
            || echo "Could not merge now and could not enable auto-merge — operator may need to merge manually (check mergeable state / branch protection)."

      # --- Operator-required comment on sensitive PRs ---
      - name: Operator-required notification
        if: steps.ctx.outputs.skip != 'true' && steps.pr.outputs.large != 'true' && steps.review.outputs.decision == 'APPROVE' && steps.sensitive.outputs.is_sensitive == 'true'
        env:
          GH_TOKEN: ${{ steps.auth.outputs.token }}
          REPO: ${{ steps.ctx.outputs.repo }}
          PR_NUM: ${{ steps.ctx.outputs.pr_number }}
          HITS: ${{ steps.sensitive.outputs.hits }}
        run: |
          BODY=$(printf '⚠️ **Operator review required** — Eva approves this PR but it touches sensitive paths. Auto-merge is blocked.\n\nSensitive files touched:\n%s\nThese paths govern Eva'"'"'s own behavior or platform-critical infrastructure. Single-reviewer (Eva-approves-Eva) is not enough for these — operator must manually merge after inspecting the diff.\n\nReference: godfather task #41 (Eva self-review strengthening, 2026-05-23).' "$HITS")

          gh pr comment "$PR_NUM" --repo "$REPO" --body "$BODY"

      # Telegram publish lives in publish-evolution.yml, triggered directly by
      # GitHub on `pull_request: closed && merged == true`. No caller-side
      # dispatcher here — caller-side gates are bypassable (workflow_run loads
      # workflows from the default branch, so an in-flight rewrite of the
      # caller still runs the OLD caller on its own PR). The merge-event
      # trigger is the canonical signal.
