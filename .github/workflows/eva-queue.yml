# Eva — Approved-Queue Executor (the proactive heartbeat, D-004 / eva#106).
#
# NOTE: this is a DISTINCT workflow from `eva-scan.yml`. eva-scan runs the
# `eva scan` mutation pipeline (Sentry/issue signals → mutation PRs). THIS
# workflow drains the cross-repo issue lifecycle queue. D-004 overloads the
# name "eva-scan"; the triage-sweep ships here as its own file so the two are
# never conflated.
#
# What it does — deterministic, no LLM:
#   Sweeps the watch-list for issues that are `approved` + open + NOT yet
#   `eva-implementing`, and dispatches `implement-issue` to eva for each (up to
#   the free per-repo build slots). This drains the ONE steady source of a real
#   queue: rate-limited issues. eva-implement leaves `approved` ON a deferred
#   issue and GitHub won't re-fire on an already-present label, so without this
#   sweep a rate-limited issue is stuck until a human removes+re-adds `approved`.
#
# What it does NOT do (yet): close stale/duplicate, ping stalled. That layer is
# judgment-heavy + destructive (closing public issues) → a separate, separately
# gated workflow, not folded in here.
#
# Safety:
#   - Reuses the SAME build path as the reactive forwarder
#     (repository_dispatch:implement-issue) — no parallel build logic.
#   - Trust gated HERE (consuming actor) on the eva#132 matrix, identical to
#     eva-implement's own gate: dispatches for an issue whose author is a human
#     MEMBER/OWNER, OR whose author is ievo-eva[bot] AND `approved` was applied
#     by a human MEMBER/OWNER or the App itself (resolved from the label
#     timeline). Does not assume an upstream enforced it; fail-safe skip.
#   - Per-repo slot math (cap − in-flight) caps dispatch; eva-implement re-checks
#     the claim + rate-limit on its side, and its per-issue concurrency group
#     no-ops any duplicate vs the reactive path. The cap is best-effort (a
#     simultaneous-dispatch race can leave a couple extra parallel builds — a
#     resource cost, not a correctness/security one; no distributed lock).
#   - Live dispatch is double-gated: NOT dry_run AND vars.EVA_QUEUE_ENABLED.
#     Runs on a 30-min cron (live, flag-gated) + manual workflow_dispatch
#     (dry_run default true for safe inspection). Validated end-to-end with
#     cap=1 before the schedule was enabled.
#
# Watch-list = the D-004 repos EXCEPT godfather (operator's private command
# center). skills joined the list once its v1 issue-pipeline was removed
# (skills#277, 2026-07-02) — the conflicting `approved` label semantics that
# kept it out are gone. Harmless for not-yet-onboarded repos: they simply have
# no `approved` issues, so the sweep is a no-op there.

name: "Eva: Approved-Queue Executor"

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — log the queue + slot math, dispatch nothing"
        type: boolean
        default: true
  # Event-driven wake (eva#144): fired by `drain-queue` repository_dispatch so a
  # rate-limited (deferred) issue is retried within seconds instead of waiting up
  # to ~30min for the schedule-skewed cron below. The PRIMARY source of this
  # dispatch is `eva-implement.md` Phase 5, fired the instant the build's PR opens
  # — the true freed-slot moment post-eva#196 (eva#198). eva-review-pr.yml (on a
  # direct auto-merge) and eva-drain-kick.yml (on any `eva-impl/*` merge) also
  # fire the identical dispatch, now as harmless redundant backstops — by the time
  # either fires, the slot they used to signal was already freed at PR-open. Same
  # code path as the cron: no payload is read, and the drain step re-verifies the
  # eva#132 label/approver trust chain per issue exactly as a scheduled run does.
  # A dispatch has no `dry_run` input, so DRY_RUN='' → live-eligible (gated by
  # vars.EVA_QUEUE_ENABLED), identical to the scheduled path.
  repository_dispatch:
    types: [drain-queue]
  schedule:
    # Every 30 min, offset off the top of the hour (GitHub deprioritizes :00).
    # A freed build slot is picked up within ~30 min; the sweep is ~10s of API
    # calls and a no-op when the queue is empty. Scheduled runs have no dry_run
    # input → live (gated by vars.EVA_QUEUE_ENABLED; the `!= "true"` test in the
    # drain step treats the empty input as live-eligible). Kept as the fail-safe
    # backstop behind the event-driven `drain-queue` dispatch above (e.g. a review
    # run that dies before reaching its dispatch step).
    - cron: "7,37 * * * *"

permissions:
  contents: read

concurrency:
  group: eva-queue
  cancel-in-progress: false

jobs:
  drain:
    name: "Eva: drain approved queue"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate App token
        if: vars.USE_GITHUB_APP == 'true'
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547  # v1.12.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ievo-ai

      - name: Set auth token
        id: auth
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          PAT_TOKEN: ${{ secrets.EVA_PAT_GITHUB_TOKEN }}
        run: |
          if [ -n "$APP_TOKEN" ]; then
            echo "token=$APP_TOKEN" >> "$GITHUB_OUTPUT"
          else
            echo "token=$PAT_TOKEN" >> "$GITHUB_OUTPUT"
          fi

      - name: Drain approved queue
        env:
          GH_TOKEN: ${{ steps.auth.outputs.token }}
          # Space-separated watch-list (owner/repo). Excludes godfather only.
          WATCH_LIST: >-
            ievo-ai/eva
            ievo-ai/cli
            ievo-ai/marketplace
            ievo-ai/curator
            ievo-ai/sdk
            ievo-ai/skills
            ievo-ai/agents
            ievo-ai/cortex
            ievo-ai/ievo.ai
          MAX_INFLIGHT: ${{ vars.EVA_MAX_INFLIGHT || '3' }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          QUEUE_ENABLED: ${{ vars.EVA_QUEUE_ENABLED }}
        run: |
          set -euo pipefail

          # Live dispatch only when NOT dry_run AND the flag is on. Note: a
          # scheduled run has no dry_run input (DRY_RUN=''), which must count as
          # live-eligible — so test `!= "true"`, not `== "false"`. The
          # workflow_dispatch default (true) keeps manual runs safe.
          LIVE="false"
          if [ "$DRY_RUN" != "true" ] && [ "$QUEUE_ENABLED" = "true" ]; then
            LIVE="true"
          fi
          echo "Mode: $([ "$LIVE" = "true" ] && echo 'LIVE dispatch' || echo 'DRY RUN (no dispatch)')"

          TOTAL_QUEUED=0; TOTAL_DISPATCHED=0; TOTAL_SKIPPED=0

          for REPO in $WATCH_LIST; do
            # Open issues labelled `approved`. (`approved` and `eva-implementing`
            # are mutually exclusive — the claim swaps one for the other — but we
            # re-check below to be safe against any drift.)
            APPROVED=$(gh issue list --repo "$REPO" --label approved --state open \
              --limit 100 --json number --jq '.[].number' 2>/dev/null || true)
            [ -z "$APPROVED" ] && continue

            INFLIGHT=$(gh issue list --repo "$REPO" --label eva-implementing \
              --state open --json number --jq 'length' 2>/dev/null || echo 0)
            SLOTS=$(( MAX_INFLIGHT - INFLIGHT ))

            for N in $APPROVED; do
              TOTAL_QUEUED=$(( TOTAL_QUEUED + 1 ))

              # Pull author_association + labels + author login in one call.
              # Guard with `|| true`: a transient API hiccup or a since-deleted
              # issue must skip THIS issue, not abort the whole sweep under set -e.
              META=$(gh api "repos/$REPO/issues/$N" \
                --jq '{assoc:.author_association, by:.user.login, labels:[.labels[].name]}' \
                2>/dev/null || true)
              if [ -z "$META" ]; then
                echo "  $REPO#$N — could not fetch issue metadata, skip"
                TOTAL_SKIPPED=$(( TOTAL_SKIPPED + 1 )); continue
              fi
              ASSOC=$(printf '%s' "$META" | jq -r '.assoc')
              AUTHOR=$(printf '%s' "$META" | jq -r '.by')
              HAS_IMPL=$(printf '%s' "$META" | jq -r '.labels | index("eva-implementing") | if . == null then "no" else "yes" end')

              if [ "$HAS_IMPL" = "yes" ]; then
                echo "  $REPO#$N — already eva-implementing, skip"
                TOTAL_SKIPPED=$(( TOTAL_SKIPPED + 1 )); continue
              fi

              # Trust gate (eva#132 matrix — this workflow is the consuming
              # actor; kept identical to eva-implement.yml's repository_dispatch
              # gate, which re-verifies on its side). Admit either:
              #   (a) issue author is a human MEMBER/OWNER, or
              #   (b) issue author is ievo-eva[bot] AND `approved` was applied by
              #       a human MEMBER/OWNER (one-click adoption) or by the App
              #       itself (skeptic-mode self-approve).
              # For the bot case we resolve WHO applied `approved` (the label
              # sender is not on a poll, so read it from the timeline) and map
              # their repo permission to the association eva-implement expects —
              # the same admin→OWNER / write→MEMBER mapping as skills#283's
              # forward-to-eva "Resolve approved-by trust" step. Fail-safe: any
              # lookup error / insufficient permission → skip THIS issue.
              APPROVED_BY_LOGIN=""
              APPROVED_BY_ASSOC="NONE"
              if [ "$AUTHOR" = "ievo-eva[bot]" ]; then
                # Most-recent `labeled:approved` event wins (the label may have
                # been toggled). Streaming select over --paginate + tail -n 1,
                # the same timeline pattern the Router uses for its daily cap.
                APPROVED_BY_LOGIN=$(gh api "repos/$REPO/issues/$N/timeline" --paginate \
                  --jq '.[] | select(.event=="labeled" and .label.name=="approved") | .actor.login' \
                  2>/dev/null | tail -n 1 || true)
                if [ "$APPROVED_BY_LOGIN" = "ievo-eva[bot]" ]; then
                  # App self-approve — eva-implement admits it via approved_by_login;
                  # association stays NONE (matches skills#283).
                  APPROVED_BY_ASSOC="NONE"
                elif [ -n "$APPROVED_BY_LOGIN" ]; then
                  PERM=$(gh api "repos/$REPO/collaborators/$APPROVED_BY_LOGIN/permission" \
                    --jq '.permission' 2>/dev/null || echo "none")
                  case "$PERM" in
                    admin) APPROVED_BY_ASSOC="OWNER" ;;
                    write) APPROVED_BY_ASSOC="MEMBER" ;;
                    *)     APPROVED_BY_ASSOC="NONE" ;;
                  esac
                fi
                # Admit only a trusted applier; otherwise fail-safe skip.
                if [ "$APPROVED_BY_LOGIN" != "ievo-eva[bot]" ] \
                   && [ "$APPROVED_BY_ASSOC" != "MEMBER" ] \
                   && [ "$APPROVED_BY_ASSOC" != "OWNER" ]; then
                  echo "  $REPO#$N — bot-authored, but 'approved' applier '${APPROVED_BY_LOGIN:-unknown}' is not trusted (assoc=$APPROVED_BY_ASSOC), skip"
                  TOTAL_SKIPPED=$(( TOTAL_SKIPPED + 1 )); continue
                fi
              else
                # Non-bot author must be a human MEMBER/OWNER (unchanged floor).
                case "$ASSOC" in
                  MEMBER|OWNER) : ;;
                  *)
                    echo "  $REPO#$N — author $AUTHOR is $ASSOC (not MEMBER/OWNER), skip"
                    TOTAL_SKIPPED=$(( TOTAL_SKIPPED + 1 )); continue ;;
                esac
              fi

              if [ "$SLOTS" -le 0 ]; then
                echo "  $REPO#$N — queued, but no free slots (inflight=$INFLIGHT/$MAX_INFLIGHT), defer to next sweep"
                TOTAL_SKIPPED=$(( TOTAL_SKIPPED + 1 )); continue
              fi

              if [ "$LIVE" = "true" ]; then
                jq -nc \
                  --arg repo "$REPO" --argjson num "$N" \
                  --arg assoc "$ASSOC" --arg by "$AUTHOR" \
                  --arg author_login "$AUTHOR" \
                  --arg approved_by "$APPROVED_BY_LOGIN" \
                  --arg approved_assoc "$APPROVED_BY_ASSOC" \
                  '{event_type:"implement-issue", client_payload:{repo:$repo, issue_number:$num, author_association:$assoc, issue_author_login:$author_login, approved_by_login:$approved_by, approved_by_association:$approved_assoc, triggered_by:$by}}' \
                  | gh api "repos/ievo-ai/eva/dispatches" --input -
                echo "  $REPO#$N — DISPATCHED implement-issue (author $AUTHOR/$ASSOC)"
                SLOTS=$(( SLOTS - 1 ))
                TOTAL_DISPATCHED=$(( TOTAL_DISPATCHED + 1 ))
              else
                echo "  $REPO#$N — WOULD dispatch (author $AUTHOR/$ASSOC, slots left=$SLOTS)"
                SLOTS=$(( SLOTS - 1 ))
                TOTAL_DISPATCHED=$(( TOTAL_DISPATCHED + 1 ))
              fi
            done
          done

          echo ""
          echo "Queue sweep: queued=$TOTAL_QUEUED dispatched=$TOTAL_DISPATCHED skipped=$TOTAL_SKIPPED (live=$LIVE)"
