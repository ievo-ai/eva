name: Eva Research

on:
  schedule:
    - cron: '0 6 * * 1'  # Weekly, Monday 6am UTC
  workflow_dispatch: {}

permissions:
  contents: read
  # Claude's research may survey existing PRs / issues for context (not for triggering activity).
  pull-requests: read
  issues: read

jobs:
  research:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Eva
        run: pip install -e ".[dev]"

      # Run Researcher via the official Claude Code GitHub Action (v1 — floating
      # major, currently resolves to v1.0.127 released 2026-05-19). Replaces the
      # previous `claude -p ...` invocation which failed since March 2026 with
      # "claude: command not found" because the runner doesn't have the CLI
      # installed and no Install step existed. Using the action also handles
      # authentication via CLAUDE_CODE_OAUTH_TOKEN (org-level secret) — no need
      # for ANTHROPIC_API_KEY directly.
      #
      # SECURITY NOTE: the prompt below is hardcoded literal text (no untrusted
      # github.event.* inputs interpolated). The only `${{ ... }}` is the
      # CLAUDE_CODE_OAUTH_TOKEN secret, which is the action's documented input
      # mechanism and not user-controlled.
      - name: Run Researcher agent
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Read agents/researcher/ROLE.md. You are the Researcher agent.
            Load your memory files first.
            Scan recent AI/SDD papers, blogs, and GitHub repos from the last 2 weeks.
            Generate improvement proposals for the iEvo system.
            Save findings to spec/research/ as PROP-*.md files.

      - name: Run Eva scan with research
        env:
          EVA_PAT_GITHUB_TOKEN: ${{ secrets.EVA_PAT_GITHUB_TOKEN }}
        run: |
          eva scan --include-research spec/research/

      - name: Upload proposals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-proposals
          path: spec/research/PROP-*.md
          if-no-files-found: ignore
