            ## Step 7 — Open the audit-report PR to ievo-ai/eva

            This is what makes the report persist in git so future runs
            can read it.

            ```
            cd /home/runner/work/eva/eva  # eva's checkout
            git config user.email "noreply@ievo.ai"
            git config user.name "ievo-eva"

            # Set up gh-aware git auth so push uses GH_TOKEN (the GitHub App
            # installation token from settings.env) — push is attributed to
            # the ievo-eva App; commit author stays ievo-eva (git config above)
            gh auth setup-git

            STAMP=$(date -u +%Y-%m-%d-%H%M)
            git checkout -b "research/audit-${STAMP}"
            git add researches/
            git commit -m "research: audit ${STAMP} (<N> findings, <M> deferred)" \
              -m "Co-Authored-By: iEVO <noreply@ievo.ai>"
            git push -u origin "research/audit-${STAMP}"

            gh pr create \
              --repo ievo-ai/eva \
              --title "research: audit ${STAMP}" \
              --label silent \
              --body "Automated research audit report. See file in this PR for details. Reviewed and auto-merged by Eva. Routine report — carries the \`silent\` label so publish-evolution.yml does NOT fire Telegram on merge (the finding-issues are the signal, not the daily report)."
            ```

            If push fails with auth error: STOP and report the error in
            Step 8 summary. Do NOT retry with different creds — that means
            the PAT scope is wrong and the operator needs to fix it.

            ## Step 8 — Pre-exit verification AND wrap up

            **Run the four verification commands from the ⛔ checklist
            at the TOP of this prompt — BEFORE writing the summary
            text.** Each must succeed:

              # 1. Backlog has new sections for today
              BACKLOG_COUNT=$(grep -c "^## F-$(date -u +%Y-%m-%d)-" \
                researches/findings-backlog.md 2>/dev/null || echo 0)
              echo "Backlog sections today: $BACKLOG_COUNT"

              # 2. Each new section has status: issued + issue_url
              awk "/^## F-$(date -u +%Y-%m-%d)-/,/^## /" \
                researches/findings-backlog.md \
                | grep -E "status: issued" | wc -l
              # → should equal BACKLOG_COUNT

              # 3. Audit report file exists from this run
              ls -la researches/$(date -u +%Y-%m-%d)-*-skills-audit.md 2>&1

              # 4. Audit-report PR opened in eva
              gh pr list --repo ievo-ai/eva --state open \
                --search "research: audit $(date -u +%Y-%m-%d) in:title" \
                --json number,headRefName,createdAt

            If any of the four fails: STOP. Go execute the missing
            step (re-do Step 4b.1/4b.3 for backlog, Step 6 for audit
            report, Step 7 for the eva PR). Then re-run verification.

            ONLY after all four pass — print the final summary to
            stdout (your last assistant message in this run) listing:
              - Audit report PR URL (the eva-side PR with the report)
              - Skills PRs opened (URLs from Step 5, if any)
              - Findings filed (backlog IDs + issue URLs from Step 4b)
              - Findings found but NOT opened, with reasons
              - Anything blocked
              - Verification command outputs (proof all four pass)

            ## Safety reminders (non-negotiable)
              - NEVER auto-merge — every PR awaits review (Eva-review-pr
                will handle approval automation for trivial cases)
              - Additions only — no deletions unless the finding is
                explicitly a removal proposal
              - If you'd open more than 5 skills PRs, stop at 5 and list
                the rest as deferred
              - The audit report PR is REQUIRED even on a zero-finding
                run. "Audited X areas, found nothing actionable" IS data
                worth recording.
              - Steps 6 + 7 (write report + open eva PR) are the SLA of
                this workflow. If for any reason you can't complete the
                full audit, you still write a partial report (with
                `verdict: blocked` and `Notes for next run` explaining
                where you stopped) and open the eva PR before exiting.
                Partial output > nothing.
