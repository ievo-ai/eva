name: Eva Research

# Trivial test marker: smoke test for sensitive-path gate on
# `.github/workflows/` (godfather task #41, verification 2026-05-23).
# Expected: Eva approves + posts operator-required comment +
# auto-merge BLOCKED.

# Skills-only Researcher MVP (godfather task #39, Variant 1).
#
# Eva audits ievo-ai/skills end-to-end and opens atomic improvement PRs
# there. The general ecosystem-wide literature scan (arXiv / Anthropic
# blogs / HN) is deliberately OUT OF SCOPE for this workflow — it will
# land as a separate, broader workflow once this skills loop is proven.
# Keeping the loop tight makes failures diagnosable and the cost bounded.
#
# What this workflow does NOT do:
#   - No general-purpose literature scan
#   - No PROP-*.md file generation
#   - No `eva scan` pipeline invocation (the previous `--include-research`
#     flag never existed in the eva CLI — removed)
#   - No upload-artifact (nothing to upload)
#   - No cross-repo PR open beyond ievo-ai/skills

on:
  schedule:
    # Daily at 06:00 UTC (07:00 Europe/GMT+1, 08:00 Europe/GMT+2 summer).
    # Operator preference 2026-05-22 — switched from weekly Monday to daily
    # so Eva surfaces drift faster. Noise floor with daily cron: ~7
    # audit-report PRs/week guaranteed (one per run), plus 0–35 skills
    # PRs/week depending on findings. Each merged PR fires Telegram via
    # publish-evolution.yml (PR #25 trigger). If the cadence proves too
    # loud, options without going back to weekly: (a) gate audit-report
    # PR's Telegram fire behind a "silent" label, (b) skip audit-report
    # PR on zero-finding runs (lossy — we lose the "audited X, found
    # nothing" data point).
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read
  issues: read
  # Required by anthropics/claude-code-action@v1: the action fetches an
  # OIDC token (via @actions/core's getIDToken) to identify the workflow
  # run to Anthropic's API. Without `id-token: write` the runtime cannot
  # mint the token and the action fails before doing any work.
  id-token: write

jobs:
  research:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # --- Auth: prefer the GitHub App installation token so issues + PRs are
      #     attributed to the ievo-eva App, not the operator's PAT account.
      #     Mirrors eva-scan.yml / eva-review-pr.yml. `owner: ievo-ai` mints a
      #     token spanning the org repos the App is installed on (eva + skills),
      #     so the cross-repo `gh issue create` / `gh pr create` into skills
      #     work. PAT fallback retained for when USE_GITHUB_APP is unset. This
      #     is a cron/dispatch workflow (no `pull_request` event), so it is NOT
      #     subject to the workflow-modifying-PR App-token scope downgrade that
      #     forces PAT in eva-review-pr.yml.
      - name: Generate App token
        if: vars.USE_GITHUB_APP == 'true'
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ievo-ai

      - name: Set auth token
        id: auth
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          PAT_TOKEN: ${{ secrets.EVA_PAT_GITHUB_TOKEN }}
        run: |
          if [ -n "$APP_TOKEN" ]; then
            echo "token=$APP_TOKEN" >> "$GITHUB_OUTPUT"
            echo "Using App token — issues/PRs attributed to the ievo-eva App"
          else
            echo "token=$PAT_TOKEN" >> "$GITHUB_OUTPUT"
            echo "Using PAT fallback (USE_GITHUB_APP not 'true' or App token unavailable)"
          fi

      # Direct skills-repo audit + PR opening.
      #
      # Tool surface (via `claude_args --allowedTools`):
      #   Bash    — required for git clone/commit/push and gh pr create
      #   Edit    — modify existing files in /tmp/skills checkout
      #   Read    — read files for audit
      #   Write   — create new files (e.g. new skill, new test fixture)
      #   Glob    — find files by pattern
      #   Grep    — search file contents
      #   WebFetch / WebSearch — cross-reference against external sources
      #     (agentskills.io spec updates, Anthropic docs, trending repos)
      #
      # Tokens (via `settings.env`):
      #   GH_TOKEN — `gh` auth, both repos (eva + skills). Now the GitHub App
      #     installation token from the auth step above (PAT fallback), so
      #     issues + PRs (and the audit-report PR push, via `gh auth setup-git`)
      #     are created BY the ievo-eva App, not the operator's PAT account.
      #     ievo-eva is also an admin collaborator on ievo-ai/skills (2026-05-20).
      #   `claude_env` is NOT a valid input on this action — confirmed via
      #     run 26176453911 warning. `settings.env` is the documented path.
      #
      # Model / turns: sonnet + 40 turns. Audit + PR opening for 3-5
      # findings fits comfortably; raise via workflow_dispatch override if
      # the audit consistently runs out of budget. Opus override possible
      # by editing this line — costlier, not necessary at this stage.
      - name: Run Researcher agent (skills audit)
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Surface Claude's per-turn output in the workflow log. Default
          # is `false` (action prints "Running Claude Code via SDK (full
          # output hidden for security)") which makes debugging impossible
          # — run 26177773647 spent 65 turns / 7m / $2.34 producing zero
          # PRs and we had no idea what Claude was actually doing.
          # Hidden-by-default makes sense in a PR-comment context where
          # Claude's drafts leak into a public PR thread; in a scheduled
          # background workflow, full output is exactly what we need.
          show_full_output: true
          # Allow the GitHub App `ievo-eva` to initiate this workflow
          # via cron. By default `anthropics/claude-code-action@v1`
          # rejects non-human actors with "actor not found on GitHub".
          # Scheduled runs report the App as the triggering actor,
          # which fails this check. Confirmed empirically 2026-05-23
          # at 07:04 UTC — first scheduled run (26326481678) failed
          # exactly here. Manual workflow_dispatch runs report the
          # operator as actor and skip this check.
          allowed_bots: "ievo-eva"
          claude_args: |
            --model sonnet
            --allowedTools "Bash,Edit,Read,Write,Glob,Grep,WebFetch,WebSearch"
          settings: |
            {
              "env": {
                "GH_TOKEN": "${{ steps.auth.outputs.token }}",
                "EVA_PAT_GITHUB_TOKEN": "${{ secrets.EVA_PAT_GITHUB_TOKEN }}"
              }
            }
          prompt: |
            ## ⛔ HARD ENFORCEMENT CHECKLIST — read BEFORE planning your work

            You CANNOT print a final summary until ALL FOUR of these are
            verifiably true on disk and on GitHub. Treat them as the
            DEFINITION of "this run is done". A workflow conclusion of
            "success" with any of these missing is a FAILURE on your
            side that the operator will manually rerun. Run 26301254869
            (2026-05-22T17:01Z) failed this way — opened 2 issues but
            skipped the backlog + audit report; operator had to
            investigate why.

            REQUIRED OUTPUTS:

            1. **`researches/findings-backlog.md` updated** — for every
               finding you filed in Step 4b, the file has a new section
               with the YAML metadata block. If you opened 2 issues,
               this file has 2 new `## F-YYYY-MM-DD-NNN` sections.
               Verify before exit:
                 grep -c "^## F-$(date -u +%Y-%m-%d)-" researches/findings-backlog.md
               must be ≥ number of issues you filed today.

            2. **Each new backlog section has `status: issued` +
               `issue_url`** — not `status: raw` at end of run. Verify:
                 grep -A 4 "^## F-$(date -u +%Y-%m-%d)-" researches/findings-backlog.md \
                   | grep -E "(status:|issue_url:)"
               every backlog section from today must show `issued` +
               a non-empty URL.

            3. **`researches/YYYY-MM-DD-HHMM-skills-audit.md` written**
               with the full Step 6 template (frontmatter + all body
               sections). Verify:
                 ls -la researches/$(date -u +%Y-%m-%d)-*-skills-audit.md
               must show at least one file from this run.

            4. **Audit-report PR opened to `ievo-ai/eva` from a
               `research/audit-YYYY-MM-DD-HHMM` branch**. Verify:
                 gh pr list --repo ievo-ai/eva --state open \
                   --search "research: audit $(date -u +%Y-%m-%d)" \
                   --json number,headRefName
               must show your PR.

            If you are about to print summary text and ANY of these
            four return empty or below threshold, STOP. Go back, do
            the missing step, then verify again. Repeat until all four
            pass. Only then summarize.

            Steps 6 + 7 are NOT "nice to have at the end". They are
            the persistence contract — without them, the next Eva run
            has no memory of what this run did, and the backlog
            silently empties run-over-run.

            ## You are Eva — Researcher role

            You are Eva playing the Researcher role for this run, focused
            exclusively on auditing the ievo-ai/skills repo and opening
            atomic improvement PRs. EVERY run MUST end with a research
            report PR opened against this repo (ievo-ai/eva) — that report
            is how future runs of you know what's been audited before.

            ## Step 1 — Load Eva's identity AND past research history

            Eva's identity (current repo, working directory is the eva
            checkout):
              - Read agent/ROLE.md
              - Read agent/memory/CONTEXT.md
              - Read agent/memory/HISTORY.md
              - Read agent/memory/DECISIONS.md

            Past research history — CRITICAL for not redoing work:
              - `ls -t researches/*-skills-audit.md 2>/dev/null
                | head -5` to find the 5 most recent audits (newest first)
              - Read each of them
              - Build a mental "seen" map from their content:
                  * Areas marked thoroughly audited recently → SKIP or
                    quick sanity-check only
                  * "Deferred findings" from prior runs → reconsider with
                    fresh context, may now be actionable
                  * "Notes for next run" lines → honor them as if you
                    wrote them (you did)
              - If the directory is empty (first run), proceed normally.

            Findings backlog — the canonical source of past proposals
            (Step 4b reads/appends to this):
              - Read `researches/findings-backlog.md` (entire file)
              - Build a `discovered_already` set keyed by `evidence` URLs
                AND `title` semantic match
              - During Step 4b, SKIP any finding represented here
                regardless of status (raw / issued / accepted /
                implemented / rejected / parked) — don't re-propose

            Past feature proposals in target repos — secondary dedup
            layer (in case a finding got into a repo's issues without
            backlog tracking, e.g. operator opened it manually):
              - Issues with `feature-proposal` label (current scheme,
                post-2026-05-22):
                `gh issue list --repo ievo-ai/skills --state open
                --label feature-proposal --json number,title`
              - Legacy PRs with `feature-proposal` label
                (transitional period 2026-05-22 PM):
                `gh pr list --repo ievo-ai/skills --state open
                --label feature-proposal --json number,title`
              - Legacy issues with `eva-proposal` label (initial scheme,
                pre-2026-05-22 PM):
                `gh issue list --repo ievo-ai/skills --state open
                --label eva-proposal --json number,title`
              - CLOSED issues Eva's skeptic mode already REJECTED (eva#132):
                `gh issue list --repo ievo-ai/skills --state closed
                --label eva-rejected --json number,title`
                A once-refuted finding must NOT resurface under a new number
                every daily audit. If a candidate matches a closed
                `eva-rejected` issue by SUBSTANCE (the concrete gap, not the
                wording), do NOT re-file. If genuinely new evidence changes the
                picture, COMMENT on the rejected issue instead and let a human
                decide whether to unlock it (re-apply `approved`).
              - Merge with `discovered_already` from backlog.

            SUBJECT-KEY dedup — MANDATORY, stronger than title matching.
            Title matching alone has FAILED: the same upstream subject was
            filed 2-3x under different framings (e.g. `--safe-mode` across
            three issues; `availableModels` across three; `display-name`
            across two). For EACH candidate finding AND each open proposal
            above, derive a SUBJECT KEY = the specific upstream identifier it
            concerns:
              - the exact setting / env var / CLI flag (e.g. `fallbackModel`,
                `--safe-mode`, `CLAUDE_CODE_SUBAGENT_MODEL`), OR
              - the frontmatter key (e.g. `display-name`, `effort`), OR
              - the command / feature (e.g. `/import`, multi-agent delegation),
              paired with the platform (Claude Code / Codex / Cursor).
            DELIBERATELY EXCLUDE the version number from the key — "document X
            (v2.1.166)" and "document X (v2.1.187)" are the SAME subject. Also
            collapse the verb: "document X", "add X", "validate X", "update
            security model with X" are the SAME subject when X matches.
            If a candidate's subject key matches ANY open proposal's subject
            key, DO NOT file — record `covered by #N` in the backlog instead.
            When UNSURE whether two subjects are the same, treat them as the
            SAME and SKIP. Under-filing is cheap; a duplicate the operator
            must triage and close is not. Cap: at most ONE issue per distinct
            subject key per run.

            Sources index — for diff-based scanning later (Step 4):
              - Read `researches/sources-index.md` (entire file)
              - Build a "last seen" map: per URL note last_scan
                timestamp, status, and the most recent summary
              - You will use this in Step 4 to decide which URLs need a
                deep summary (`status: changed`) vs a brief note
                (`status: unchanged`)

            ## Step 2 — Load the skills repo and its rule book

            ```
            git clone --depth 1 https://github.com/ievo-ai/skills.git /tmp/skills
            ```

            Then read /tmp/skills/AGENTS.md *fully* — every rule there
            must be honored by any PR you open. Pay particular attention
            to:
              - Vendor-neutral model aliases (sonnet/opus/haiku/inherit)
              - 100% test coverage rule on plugins/ievo/scripts/*.mjs
                (scan_repo.mjs grandfathered until v0.6.1)
              - Per-PR version bump in BOTH
                plugins/ievo/.claude-plugin/plugin.json AND
                .claude-plugin/marketplace.json (metadata.version +
                plugins[0].version)
              - Branch naming: feat/v<x.y.z>-<slug> or fix/v<x.y.z>-<slug>
              - Commit footer: Co-Authored-By: iEVO <noreply@ievo.ai>
              - Universal positioning — NOT Claude Code-only

            ## Step 3 — Audit. Walk these areas in /tmp/skills

              a. plugins/ievo/skills/*/SKILL.md — trigger-effective
                 descriptions? Conform to agentskills.io spec?
              b. plugins/ievo/agents/*.md — vendor-neutral models? Passes
                 validate_agents.mjs?
              c. plugins/ievo/scripts/*.mjs — 100% test coverage rule
                 satisfied? Any new scripts since v0.6.0 without tests?
              d. plugin.json + marketplace.json — version drift?
              e. README.md + AGENTS.md — universal positioning consistent?
              f. `gh pr list --repo ievo-ai/skills --state open` — for
                 DEDUPE only: never open a PR for a finding already in
                 review.

            Honor Step 1 findings — don't re-audit areas your prior selves
            recently cleared.

            ## Step 4 — Systematic source scan (official + community)

            Eva exists to bring outside knowledge into the iEvo ecosystem.
            This step is the input pipeline for Step 4b's feature
            proposals — you can't propose a new capability if you don't
            see what the rest of the world has shipped.

            **The canonical source list lives in `researches/sources-index.md`**
            (you loaded it in Step 1). Iterate over every URL listed
            there. The bootstrap list below is what the file initially
            contains; if it has been amended over time, scan the file's
            actual list, not this prompt's bullet list.

            For each URL:
              1. WebFetch the URL
              2. Skim for what's new in the last 14 days (focus on
                 changes affecting a Claude/Codex/Gemini-host agent-skill
                 repo). Ignore enterprise pricing, marketing, etc.
              3. Compare to the prior `**Summary:**` in the index for
                 this URL — is this a real change or substantively the
                 same content?
              4. Use the `Edit` tool to update ONLY this URL's section in
                 `researches/sources-index.md`:
                 - Replace the yaml block atop the section with new
                   `last_scan`, `status` (`changed` / `unchanged` /
                   `error`), `run_id: $GITHUB_RUN_ID`
                 - Replace the `**Summary:**` line with the fresh
                   summary (or "unchanged from previous" if no change)
                 - PREPEND a new bullet to `History:` — format
                   `- <ISO 8601 timestamp> — <status>: <one-line note>`
                 - DO NOT touch other URL sections in the file
              5. If the URL is not yet in the index → add a new section
                 at the bottom following the file's format
              6. If WebFetch fails (404 / rate-limit / timeout) → set
                 `status: error`, record the error briefly in History,
                 continue to the next URL

            Quality over quantity: a well-digested signal from one
            source beats a URL dump from ten. URLs marked `unchanged`
            since last scan can be noted briefly without deep re-summary.

            The audit report (Step 6) gets a summary of this scan —
            don't enumerate every URL verbatim there; the canonical
            per-URL state lives in `researches/sources-index.md`. The
            report should highlight what's NEW (status: changed entries
            from this run) and refer the reader to the index for the
            full state.

            ## Step 4b — Feature gap discovery (findings → backlog → issue)

            Audit finds bugs in existing functionality (Step 3-5). Step 4b
            looks for capabilities the target repo (skills / cortex /
            agents / etc.) is MISSING — things that should exist but
            don't. Examples:
              - A pattern Cursor/Codex shipped that skills lacks
              - A new agent role that would improve quality / dev velocity
              - An integration with a popular MCP server
              - A workflow gap (no skill for common task X)

            For each gap meeting ALL of these:
              - Concrete (one sentence describing the new capability)
              - Atomic (one capability per finding — no umbrella issues)
              - Justified (link to specific external evidence FROM YOUR
                STEP 4 SCAN — quote the source URL and the observation
                that triggered this)
              - Not a duplicate of any finding already in
                `researches/findings-backlog.md` (any status) OR any
                open `feature-proposal` issue in the target repo
                (you pre-loaded both sets in Step 1)
              - Not matching any CLOSED `eva-rejected` issue in the target
                repo (eva#132 — a skeptic-refuted idea stays dead until a
                human unlocks it; comment on it instead of re-filing)

            Strong preference: at least ONE finding per run if Step 4
            surfaced anything notable. Many zero-finding runs in a row =
            flag in "Notes for next run" so the operator can broaden the
            source list.

            **Findings-first flow (operator preference 2026-05-22, switched
            from prior PR-as-default). Eva NO LONGER opens PRs with
            scaffolded code for proposals. Eva opens detailed ISSUES.**

            History of this design (preserved so a future editor knows
            the journey and doesn't accidentally revert):
              v1: open ISSUE with brief body → too vague for action
              v2: open DRAFT PR with scaffolded code → Claude Code Review
                  doesn't fire on drafts
              v3: open REGULAR PR with scaffolded code → Claude Code
                  Review fires, but Eva sinks 15-20 turns per proposal
                  even for ones that get rejected; PRs only target
                  skills (where Eva has admin)
              v4 (CURRENT): findings-backlog + detailed ISSUE per finding
                  → ~3 turns per proposal, persistent backlog, any
                  target repo, implementation deferred to operator or
                  Issue Triage helper (godfather task #42)

            For each gap surfaced this run:

            **Step 4b.1 — Append to findings-backlog**

            Open `researches/findings-backlog.md` and append a new
            section. Generate the finding ID:
              - Date: `date -u +%Y-%m-%d`
              - Sequence: scan the file for `id: F-<today>-NNN` entries,
                pick the next zero-padded 3-digit number (start at 001
                if today is empty)

            New section format (use the Edit tool to append; don't
            rewrite the whole file):

              ```markdown
              ## F-YYYY-MM-DD-NNN — <title>

              ```yaml
              id: F-YYYY-MM-DD-NNN
              discovered_at: <ISO 8601 UTC>
              run_id: <$GITHUB_RUN_ID>
              target_repo: ievo-ai/<repo>
              title: <one-line capability name>
              status: raw
              issue_url:
              effort: <low | medium | high>
              scope: <single-file | multi-file | new-skill | architecture-change>
              evidence:
                - <URL>: <what triggered this>
              ```

              <detailed proposal body — same content the issue will use,
              following the template in researches/findings-backlog.md
              "Issue body template" section>
              ```

            **Step 4b.2 — Open detailed issue in target_repo**

            Read the "Issue body template" section of
            `researches/findings-backlog.md` and prepare the issue body
            literally per that template — every section present
            (Summary, Problem, Evidence, Proposed solution, Files
            affected, API/UX, Acceptance criteria, Effort estimate,
            Open questions, Related). The operator wants VERY DETAILED
            issues — not the 4-section shallow body of the earlier
            scheme.

            Then create the label (idempotent) and open the issue:

              gh label create "feature-proposal" \
                --repo <target_repo> \
                --description "Capability proposal from Eva research — needs operator triage" \
                --color "1d76db" \
                2>/dev/null || true   # ignore "already exists"

              gh issue create \
                --repo <target_repo> \
                --label "feature-proposal" \
                --title "Propose: <one-line capability>" \
                --body-file /tmp/issue-body.md

            **Step 4b.3 — Update backlog entry with issue URL**

            Use the Edit tool to update the yaml block of this finding's
            section in `researches/findings-backlog.md`:
              - `status: issued`
              - `issue_url: <URL returned by gh issue create>`
            Touch only this finding's yaml block; don't disturb other
            sections.

            **Hard cap: 3 findings per run.** Findings compound across
            runs via the backlog; three high-quality is plenty per
            audit. Additional gaps go in Deferred findings of the audit
            report.

            **DO NOT use `feature-proposal` label on audit-fix
            findings** — those go as REGULAR PRs in Step 5 (no label)
            or as Deferred findings. The `feature-proposal` label is
            EXCLUSIVELY for new-capability findings filed as issues.

            ### Credit the contributors

            ALWAYS credit external sources whose pattern, repo, or
            specific work inspired the finding. After opening each
            issue (or any issue/PR that cites external work),
            immediately post a comment that:
              - @-mentions the author or repo (use the actual GitHub
                handle, e.g. `@DenisSergeevitch`, `@anthropic`)
              - Links to the specific upstream work that inspired this
              - Thanks them concretely (one line about what their work
                enabled here)

            Command pattern (use `gh issue comment` for findings issues
            opened in Step 4b; use `gh pr comment` for audit-fix PRs in
            Step 5 that cite external sources):
              gh issue comment <NUM> --repo <target_repo> \
                --body "🙏 Credit: this proposal was inspired by
                @<handle>'s [<project>](<url>) — <one line of
                what their work enabled>. Thanks for shipping
                publicly."

            Skip credit comments only when the source is an official
            Anthropic / OpenAI / Google announcement of their own
            product (no individual contributor to thank). For
            community-contributed work, library authors, blog posts,
            independent open-source repos — always credit.

            This is a hard rule from Eva's CLAUDE.md: "Credit
            contributors — when using someone's work, publicly credit
            the authors."

            ## Step 5 — Open atomic PRs to ievo-ai/skills

            For each finding meeting these gates:
              - Concrete, atomic, AGENTS.md-compliant
              - Not a duplicate of an open PR
              - One concern per PR (multiple findings = multiple PRs)

            For each PR:
              1. cd /tmp/skills
              2. git checkout -b feat/v<x.y.z>-<slug> (or fix/...)
              3. Make the change (Edit / Write tools)
              4. Bump version in BOTH manifests as required by AGENTS.md
              5. git config user.email "noreply@ievo.ai"
                 git config user.name "ievo-eva"
              6. git add -A && git commit (footer: Co-Authored-By: iEVO
                 <noreply@ievo.ai>)
              7. git push origin <branch>
              8. gh pr create --repo ievo-ai/skills --title "..." --body
                 "..." — body MUST include source-of-finding (file or
                 rule audited) and a test plan

            If `gh auth status` reports anything less than admin on
            ievo-ai/skills, stop and report — do not retry.

            Hard cap: 5 skills PRs per run. If you'd open a sixth, stop
            and list it as deferred in the audit report (Step 6 below).

            ## Step 5b — Gather self-triage stats for the digest (eva#132)

            The daily report doubles as the operator's OVERSIGHT channel for
            Eva's self-triage — the skeptic-mode dispositions on her OWN
            bot-authored issues. Post-hoc review of this list (plus the
            one-command revert of any bad merge) is what replaces pre-approval
            for the low-risk self-approve tier, so it MUST appear every run.

            For each repo Eva audits (ievo-ai/skills today; add others as they
            onboard forwarders), collect the last-24h dispositions:
              - APPROVED — bot-authored issues that received an `approved` label
                FROM the Eva App in the window (timeline `labeled` events, actor
                `ievo-eva[bot]`) — the same signal the Router's self-approve cap
                counts.
              - REJECTED — issues labeled `eva-rejected` closed in the window:
                  gh issue list --repo ievo-ai/skills --state closed \
                    --label eva-rejected \
                    --search "closed:>=$(date -u -d '1 day ago' +%Y-%m-%d)" \
                    --json number,title,closedAt
              - HELD — issues currently labeled `eva-hold-high-risk` (open):
                  gh issue list --repo ievo-ai/skills --state open \
                    --label eva-hold-high-risk --json number,title,updatedAt
            If any query errors, record "unavailable" for that repo rather than
            dropping the section. Render the result in Step 6 under
            "Self-triage last 24h".

            ## Step 6 — Write the audit report

            Even if you opened zero PRs in Step 5 — ESPECIALLY then — this
            run produced data that future you needs to read.

            File path (working in the eva checkout, NOT /tmp/skills):
              researches/YYYY-MM-DD-HHMM-skills-audit.md

