# Eva — scheduled scan
# Runs on cron (every 6 hours) and manual trigger.
# Uses Docker container for reproducible environment.
#
# Auth: supports both GitHub App (recommended) and PAT.
#   GitHub App: set APP_ID + APP_PRIVATE_KEY secrets
#   PAT: set EVA_GITHUB_TOKEN secret

name: Eva Scan

on:
  schedule:
    # Every 6 hours
    - cron: "0 */6 * * *"

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run mode (no PRs)"
        type: boolean
        default: true
      marketplace_ref:
        description: "Marketplace repo ref (branch/tag)"
        type: string
        default: "main"

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  scan:
    name: "Eva: Observe → Analyze → Mutate"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Eva
        uses: actions/checkout@v4

      - name: Checkout Marketplace
        uses: actions/checkout@v4
        with:
          repository: ievo-ai/marketplace
          ref: ${{ github.event.inputs.marketplace_ref || 'main' }}
          path: marketplace

      # --- Auth: GitHub App (preferred) or PAT fallback ---
      - name: Generate App token
        if: ${{ vars.USE_GITHUB_APP == 'true' }}
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ievo-ai

      - name: Set GitHub token
        id: auth
        run: |
          if [ -n "${{ steps.app-token.outputs.token }}" ]; then
            echo "token=${{ steps.app-token.outputs.token }}" >> $GITHUB_OUTPUT
            echo "✓ Using GitHub App token"
          else
            echo "token=${{ secrets.EVA_GITHUB_TOKEN }}" >> $GITHUB_OUTPUT
            echo "✓ Using PAT token"
          fi

      # --- Build & Run ---
      - name: Build Eva container
        run: docker build -t eva:local .

      - name: Run Eva scan
        env:
          EVA_GITHUB_TOKEN: ${{ steps.auth.outputs.token }}
          EVA_SENTRY_TOKEN: ${{ secrets.EVA_SENTRY_TOKEN }}
        run: |
          DRY_RUN_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "false" ]; then
            DRY_RUN_FLAG="--live"
          fi

          docker run --rm \
            -e EVA_GITHUB_TOKEN \
            -e EVA_SENTRY_TOKEN \
            -v ${{ github.workspace }}/marketplace:/app/marketplace:ro \
            -v ${{ github.workspace }}/output:/app/output \
            eva:local \
            scan --marketplace /app/marketplace --report /app/output/eva-report.json $DRY_RUN_FLAG

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eva-scan-${{ github.run_number }}
          path: output/eva-report.json
          retention-days: 30
          if-no-files-found: ignore
