# Eva — scheduled scan
# Runs on cron (daily) and manual trigger.
# Uses Docker container for reproducible environment.
#
# Auth: supports both GitHub App (recommended) and PAT.
#   GitHub App: set APP_ID + APP_PRIVATE_KEY secrets
#   PAT: set EVA_PAT_GITHUB_TOKEN secret
#
# workflows-permission smoke (eva#147, #151): proves the ievo-eva App can push
# workflow files after the token-routing fix (#154 — the claude-code-action git
# credential is now the App token) + the explicit `workflows: write` mint (#152/#153).

name: Eva Scan

on:
  schedule:
    # Daily, off-peak, ahead of the 06:00 research audit — anything scan
    # surfaces lands before the same morning's audit reads the ecosystem.
    # Was every 6h (from when scan was Eva's only loop); at today's signal
    # volume (~1 signal, 0 patterns per run) 4×/day only added runner minutes
    # and schedule-skew pressure on the other crons (operator decision
    # 2026-07-03). Raise the frequency again only when a real signal stream
    # exists (production Sentry, active child evolution logs).
    - cron: "0 3 * * *"

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run mode (no PRs)"
        type: boolean
        default: true
      marketplace_ref:
        description: "Marketplace repo ref (branch/tag)"
        type: string
        default: "main"

permissions:
  contents: write
  issues: read
  pull-requests: write

jobs:
  scan:
    name: "Eva: Observe → Analyze → Mutate"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Eva
        uses: actions/checkout@v4

      - name: Checkout Marketplace
        uses: actions/checkout@v4
        with:
          repository: ievo-ai/marketplace
          ref: ${{ github.event.inputs.marketplace_ref || 'main' }}
          path: marketplace

      # --- Auth: GitHub App (preferred) or PAT fallback ---
      - name: Generate App token
        if: ${{ vars.USE_GITHUB_APP == 'true' }}
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ievo-ai

      - name: Set GitHub token
        id: auth
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          PAT_TOKEN: ${{ secrets.EVA_PAT_GITHUB_TOKEN }}
        run: |
          if [ -n "$APP_TOKEN" ]; then
            echo "token=$APP_TOKEN" >> "$GITHUB_OUTPUT"
            echo "Using GitHub App token"
          else
            echo "token=$PAT_TOKEN" >> "$GITHUB_OUTPUT"
            echo "Using PAT token"
          fi

      # --- Build & Run ---
      - name: Build Eva container
        run: docker build -t eva:local .

      - name: Run Eva scan
        env:
          EVA_PAT_GITHUB_TOKEN: ${{ steps.auth.outputs.token }}
          EVA_SENTRY_TOKEN: ${{ secrets.EVA_SENTRY_TOKEN }}
          EVA_SENTRY_DSN: ${{ secrets.EVA_SENTRY_DSN }}
          EVA_ENVIRONMENT: production
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run }}
          WORKSPACE: ${{ github.workspace }}
        run: |
          DRY_RUN_FLAG=""
          if [ "$DRY_RUN_INPUT" = "false" ]; then
            DRY_RUN_FLAG="--live"
          fi

          docker run --rm \
            -e EVA_PAT_GITHUB_TOKEN \
            -e EVA_SENTRY_TOKEN \
            -e EVA_SENTRY_DSN \
            -e EVA_ENVIRONMENT \
            -v "$WORKSPACE/marketplace":/app/marketplace:ro \
            -v "$WORKSPACE/output":/app/output \
            eva:local \
            scan --marketplace /app/marketplace --report /app/output/eva-report.json $DRY_RUN_FLAG

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eva-scan-${{ github.run_number }}
          path: output/eva-report.json
          retention-days: 30
          if-no-files-found: ignore
