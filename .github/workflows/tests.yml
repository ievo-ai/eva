# Eva — CI tests
#
# The job is named "Lint & Test" so the reported status check context matches
# the required check declared in main branch protection. Workflow runs ruff
# (lint) and pytest with coverage (test) — both inside one job, hence the
# combined name. The matrix was dropped (single Python value) because matrix
# expansion would append `(3.13)` to the context and break the protection
# contract again. Add it back as a job-level matrix only if you also update
# branch protection to match.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      # persist-credentials: false — no step in this job needs repo write
      # access (lint + test only), so the checkout token is not left in
      # .git/config where any later step (or a downloaded tool) could read it.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Pinned to v1.7.7 to match .pre-commit-config.yaml's `rev: v1.7.7` for
      # the local actionlint hook — same version locally and in CI, no drift.
      # eva#259: prevents an unparseable/invalid workflow file (see eva#258,
      # where an Actions expression syntax mistake inside a run-block
      # comment broke workflow parsing) from reaching main undetected.
      #
      # The release tarball is downloaded and checksum-verified rather than
      # piped through the upstream installer script (`bash <(curl …)`): this
      # job IS main's required branch-protection check, so a remote script
      # fetched at run time must not execute unverified here. ACTIONLINT_SHA256
      # is the published SHA256 of the v1.7.7 linux/amd64 asset, confirmed
      # against a locally computed hash of the downloaded tarball.
      #
      # No file arguments: bare `actionlint` locates `.github/workflows` itself
      # and checks BOTH `.yml` and `.yaml`. A `*.yml` glob would silently skip
      # any future `.yaml` workflow (verified: the glob exits 0 on a workflow
      # file that bare `actionlint` fails).
      - name: Lint workflows (actionlint)
        env:
          ACTIONLINT_VERSION: "1.7.7"
          ACTIONLINT_SHA256: "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757"
        run: |
          curl -sSfLo actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color
        shell: bash

      # eva#266: `.gitattributes`' `merge=union` for this file resolves the
      # common git-level conflict (non-overlapping trailing appends) but does
      # nothing about a *semantic* collision — two different lesson bodies
      # landing under the same `## L-YYYY-MM-DD-NN` header when two branches
      # race to append on the same date. `uniq -d` on the sorted ID list
      # surfaces exactly that; a clean file yields an empty `$duplicates` and
      # the step passes. `|| true` on the grep guards the legitimate
      # zero-match case (an empty lessons.md, which the store's own README
      # documents as fine) from tripping bash's `pipefail` before the `-n`
      # check below ever runs.
      - name: Check for duplicate evolution lesson IDs
        run: |
          duplicates=$(grep -oE '^## L-[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]+' agent/memory/evolution/lessons.md | sort | uniq -d || true)
          if [ -n "$duplicates" ]; then
            echo "Duplicate lesson IDs found in agent/memory/evolution/lessons.md:"
            echo "$duplicates"
            exit 1
          fi
        shell: bash

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint
        run: uv run ruff check src/ tests/

      - name: Test with coverage
        run: uv run pytest tests/ -v --tb=short --cov --cov-report=term-missing
