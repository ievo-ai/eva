# Eva — CI tests
#
# The job is named "Lint & Test" so the reported status check context matches
# the required check declared in main branch protection. Workflow runs ruff
# (lint) and pytest with coverage (test) — both inside one job, hence the
# combined name. The matrix was dropped (single Python value) because matrix
# expansion would append `(3.13)` to the context and break the protection
# contract again. Add it back as a job-level matrix only if you also update
# branch protection to match.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint
        run: uv run ruff check src/ tests/

      - name: Test with coverage
        run: uv run pytest tests/ -v --tb=short --cov --cov-report=term-missing
