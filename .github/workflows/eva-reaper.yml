# Eva — Reaper: release stale `eva-implementing` claims (eva#231).
#
# THE GAP: when an eva-implement run dies WITHOUT reaching either of its
# normal exits — proven case 2026-07-24: a build exceeded the job's 50-minute
# `timeout-minutes` ceiling and GitHub cancelled it — the `Verify implement
# contract` / `Release claim on failure` post-checks in eva-implement.yml
# never run (post-steps are skipped on cancellation: neither is gated with
# `if: always()`/`cancelled()`, and `cancelled()` is a distinct outcome from
# both `success()` and `failure()`). The issue keeps its `eva-implementing`
# claim with no live run and no PR. eva-queue.yml only dispatches for
# `approved` issues and explicitly skips anything already `eva-implementing`,
# so the queue treats a dangling claim as in-flight forever — recovery
# required the operator to notice, remove the label by hand, and re-add
# `approved`. Silent-stall class the autonomous loop is designed to avoid
# (eva#170), for a failure mode `Verify implement contract` structurally
# cannot cover (it only runs on the success() path).
#
# PREREQUISITE (adopted in this same PR, eva#231 operator decision): before
# this workflow, NOTHING in a workflow run's own metadata identified which
# issue it was building — `display_title` (what `gh run list --json
# displayTitle` / the REST workflow-run object both expose) defaults to the
# triggering issue's own title for a local `issues` event (not unique, and not
# machine-parseable), and to the bare event name (`"implement-issue"`, no
# repo/issue at all) for a cross-repo `repository_dispatch` event. Neither is
# a stable identifier, and issue NUMBERS collide across the child repos
# eva-implement builds for. `eva-implement.yml` now sets:
#   run-name: "Implement <repo>#<issue>"
# (`run-name` only has access to the `github`/`inputs` contexts — evaluated
# before any step runs — so this mirrors that workflow's own `Resolve issue
# context` step's repository_dispatch-vs-issues branch.) THIS reaper is what
# actually consumes that identifier: it maps a claimed issue back to the run
# that (should have) built it via an exact `displayTitle` match.
#
# THE FIX (this workflow) — deterministic, no LLM agent, precedent shape from
# eva-conflict-scan.yml / eva-queue.yml (cron + workflow_dispatch, App-token
# writes, dry-run + live double-gate, per-run action cap):
#   For every watch-list repo, for every OPEN issue labeled `eva-implementing`:
#     1. Look up the most recent `eva-implement.yml` run (in ievo-ai/eva, where
#        the workflow lives regardless of which repo it built for) whose
#        `displayTitle` exactly equals `Implement <repo>#<issue>`.
#     2. If that run's `status` is anything other than `completed` (queued/
#        in_progress/waiting/...), it is still live — never touch the claim.
#     3. If no matching run is found at all (predates this fix, or fell out of
#        the lookback window), fall back to the issue's own most recent
#        `labeled: eva-implementing` timeline event as the reference timestamp
#        (same technique eva-queue.yml already uses for `approved`-by lookups).
#     4. Grace window: only proceed if the reference timestamp (run end, or
#        the timeline fallback) is more than `EVA_REAPER_GRACE_MINUTES`
#        (default 10) in the past — guards against reaping a claim whose
#        backing run only *just* ended (API propagation lag on the run-list
#        query, not a real stall).
#     5. If an OPEN or MERGED, same-repo `eva-impl/*` PR already references the
#        issue (identical check to eva-implement.yml's own `Verify implement
#        contract`), the contract WAS actually met — the agent's Phase 5 PR
#        opened, but the run was cancelled before it could release the claim.
#        Release `eva-implementing` only; do NOT touch `approved` (a PR
#        already covers the issue, re-queuing it would build it twice).
#     6. Otherwise no PR ever materialized: release `eva-implementing` AND
#        restore `approved`, so the next queue sweep drains it into a fresh
#        build off current `main`. Falls back to `needs-operator` if either
#        write itself fails (mirrors eva-conflict-scan.yml's `REQUEUED`
#        confirm-before-reporting-success pattern) — a failed write must never
#        silently report success while the claim state is ambiguous.
#   Every action is posted as an issue comment explaining what happened and
#   why — a reap is never silent, and no underlying work is lost (worst case,
#   a genuinely-still-useful branch just needs the operator to notice it
#   before the next build overwrites its PR-open path — an accepted, rare
#   edge the operator can always recover from manually, exactly as before this
#   workflow existed).
#
# AUTH SPLIT (deep-review finding, eva#231): the App's installation permissions
# do NOT confirm an `actions` grant (`docs/GITHUB_APP_SETUP.md` predates it) —
# `eva-ci-failure.yml` already hit this identical constraint and resolved it by
# reading run state via the PAT instead of the App token (per eva#152, a mint
# requesting an ungranted permission fails LOUDLY at the mint step; since that
# step runs unconditionally on every scheduled tick here, requesting
# `actions:read` on the App token would break EVERY run, not just a
# dormant/disabled one). Same fix here: `Fetch eva-implement run history` below
# uses `secrets.EVA_PAT_GITHUB_TOKEN` directly for the one call that needs
# `actions` scope; every other call (issue/PR reads+writes) uses the App token
# via the `Set auth token` step as before. No operator App-permission change is
# needed to enable this workflow.
#
# DORMANT BY DEFAULT: merges inert. The operator flips `EVA_REAPER_ENABLED`
# after a deliberate dry-run smoke test (same pattern as conflict-scan/queue).
#
# Safety:
#   - A release-only action (outcome 5) never changes issue state beyond the
#     claim label itself — fully reversible, and the PR it defers to is
#     already under eva-review-pr's normal gate.
#   - A restore-to-`approved` action (outcome 6) is exactly the operator's own
#     manual recovery motion, fully reversible (re-queues a fresh build; the
#     stalled branch, if one exists, is simply superseded, never deleted).
#   - Per-run action cap (`EVA_REAPER_MAX_ACTIONS`, default 10) paces recovery
#     across runs if an unusually large batch is found — not a judgment gate,
#     there is no destructive judgment call here to guard against.
#   - Live dispatch is double-gated (mirrors eva-queue.yml / eva-conflict-scan.
#     yml): NOT dry_run AND `vars.EVA_REAPER_ENABLED`. Gates every trigger,
#     manual or scheduled alike.
#   - Every write (label release, label restore) is confirmed by exit code
#     before being reported as success; any failure falls back to
#     `needs-operator` rather than silently reporting success.
#   - All label/comment writes via the App token (`ievo-eva[bot]`
#     attribution/auditability); only the run-history read uses the PAT.

name: "Eva: Reaper"

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Evaluate + report stale eva-implementing claims but perform NO label/comment writes"
        type: boolean
        default: true
  schedule:
    # Hourly at :23 — offset from eva-queue (:07/:37), eva-conflict-scan (:13
    # every 2h), eva-scan (03:00), eva-research (06:00), eva-backlog-retriage
    # (Monday 05:00). A cancelled-at-timeout run can otherwise strand a claim
    # (and the build slot it holds) indefinitely; hourly turns that into an
    # at-most-~1h-plus-grace-window recovery.
    - cron: "23 * * * *"

permissions:
  contents: read

concurrency:
  group: eva-reaper
  cancel-in-progress: false

jobs:
  reap:
    name: "Eva: reap stale eva-implementing claims"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Generate App token
        if: vars.USE_GITHUB_APP == 'true'
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547  # v1.12.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ievo-ai
          # Explicit list (eva#156/#152 lesson — a permission-* mint carries
          # ONLY the listed permissions, not the full installation set).
          # `actions` is deliberately NOT requested here: the App installation's
          # `actions` grant is unconfirmed, and per eva#152 a mint requesting an
          # ungranted permission fails LOUDLY at this step — which runs
          # unconditionally every scheduled tick, so that would break every
          # run, not just a dormant one. `eva-ci-failure.yml` hit this same
          # constraint and reads run state via the PAT instead; this workflow's
          # `Fetch eva-implement run history` step below does the same.
          #   issues:write         — label create/edit + issue comments across
          #                         the watch-list repos
          #   pull-requests:read   — `gh pr list` (check for an eva-impl/* PR
          #                         that already closes the issue)
          #   metadata:read        — baseline `gh api` reads
          permission-issues: write
          permission-pull-requests: read
          permission-metadata: read

      - name: Set auth token
        id: auth
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          PAT_TOKEN: ${{ secrets.EVA_PAT_GITHUB_TOKEN }}
        run: |
          if [ -n "$APP_TOKEN" ]; then
            echo "token=$APP_TOKEN" >> "$GITHUB_OUTPUT"
            echo "Using App token — label/comment writes attributed to ievo-eva[bot]"
          else
            echo "token=$PAT_TOKEN" >> "$GITHUB_OUTPUT"
            echo "Using PAT fallback (USE_GITHUB_APP != true)"
          fi

      # Separate step, PAT-authenticated (see "AUTH SPLIT" header comment): the
      # App's `actions` grant is unconfirmed, so this one read — the only call
      # in this workflow needing `actions` scope — goes through the PAT
      # directly, exactly like eva-ci-failure.yml's `Verify the failure
      # server-side` step. A failure here means we cannot safely tell a live
      # build from a dead one for ANY issue this run — fail the job rather than
      # risk reaping a live claim.
      - name: Fetch eva-implement run history
        env:
          GH_TOKEN: ${{ secrets.EVA_PAT_GITHUB_TOKEN }}
        run: |
          # Every child repo's eva-implement builds live here (this workflow
          # only ever runs in ievo-ai/eva, whether triggered locally via
          # `issues` or cross-repo via `repository_dispatch`). Bounded lookback
          # (last 300) rather than exhaustive: a claim whose backing run fell
          # out of this window would already have surfaced on an earlier
          # hourly sweep.
          if ! gh run list --repo ievo-ai/eva --workflow eva-implement.yml --limit 300 \
               --json displayTitle,status,conclusion,createdAt,updatedAt,url \
               > /tmp/eva-reaper-runs.json 2>/tmp/eva-reaper-runs.log; then
            echo "::error::gh run list failed — cannot safely distinguish live from dead builds this sweep, aborting"
            cat /tmp/eva-reaper-runs.log
            exit 1
          fi

      - name: Reap stale eva-implementing claims
        env:
          GH_TOKEN: ${{ steps.auth.outputs.token }}
          # Same watch-list as eva-queue.yml / eva-conflict-scan.yml (D-004
          # repos except godfather).
          WATCH_LIST: >-
            ievo-ai/eva
            ievo-ai/cli
            ievo-ai/marketplace
            ievo-ai/curator
            ievo-ai/sdk
            ievo-ai/skills
            ievo-ai/agents
            ievo-ai/cortex
            ievo-ai/ievo.ai
          GRACE_MINUTES: ${{ vars.EVA_REAPER_GRACE_MINUTES || '10' }}
          MAX_ACTIONS: ${{ vars.EVA_REAPER_MAX_ACTIONS || '10' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          REAPER_ENABLED: ${{ vars.EVA_REAPER_ENABLED }}
        run: |
          set -uo pipefail  # not -e: a single repo/issue failure must not abort the whole sweep

          # Double-gate (mirrors eva-queue.yml / eva-conflict-scan.yml): live
          # only when NOT dry_run AND the operator has flipped the var on.
          # Gates every trigger alike — a manual dry_run=false dispatch is
          # ALSO report-only until the var is set. A scheduled run has no
          # dry_run input (DRY_RUN='' -> 'false' via the || above).
          LIVE="false"
          if [ "$DRY_RUN" != "true" ] && [ "$REAPER_ENABLED" = "true" ]; then
            LIVE="true"
          fi
          echo "Mode: $([ "$LIVE" = "true" ] && echo 'LIVE' || echo 'DRY RUN (report only)') (grace=${GRACE_MINUTES}m, max actions/run: $MAX_ACTIONS)"

          # Reference cutoff for the grace window: any reference timestamp
          # (run end time, or the timeline-labeled fallback) that sorts AFTER
          # this cutoff is too recent to act on yet. ISO-8601 UTC "Z"
          # timestamps (what both the Actions API and the issue-timeline API
          # return) compare correctly with plain string `<`/`>` — fixed-width,
          # zero-padded fields — so no epoch conversion is needed per-run.
          CUTOFF=$(date -u -d "-${GRACE_MINUTES} minutes" +%Y-%m-%dT%H:%M:%SZ)

          TOTAL_FOUND=0; TOTAL_LIVE=0; TOTAL_GRACE=0; TOTAL_RELEASED=0; TOTAL_REQUEUED=0; TOTAL_NEEDS_OPERATOR=0; TOTAL_SKIPPED=0; ACTIONS=0

          for REPO in $WATCH_LIST; do
            if ! CLAIMED=$(gh issue list --repo "$REPO" --label eva-implementing --state open --limit 100 \
              --json number,url 2>/tmp/eva-reaper-issues.log); then
              echo "  $REPO — gh issue list failed, skipping this repo this run:"; tail -5 /tmp/eva-reaper-issues.log
              continue
            fi
            COUNT=$(printf '%s' "$CLAIMED" | jq 'length')
            [ "$COUNT" = "0" ] && continue

            # PRs for this repo, fetched once (not once per issue below).
            if ! gh pr list --repo "$REPO" --state all --limit 100 \
                 --json number,state,headRefName,title,body,isCrossRepository,url \
                 > /tmp/eva-reaper-prs.json 2>/tmp/eva-reaper-prs.log; then
              echo "  $REPO — gh pr list failed, skipping this repo this run:"; tail -5 /tmp/eva-reaper-prs.log
              continue
            fi

            for i in $(seq 0 $((COUNT - 1))); do
              ISSUE=$(printf '%s' "$CLAIMED" | jq ".[$i]")
              N=$(printf '%s' "$ISSUE" | jq -r '.number')
              TOTAL_FOUND=$(( TOTAL_FOUND + 1 ))

              # Exact match to eva-implement.yml's `run-name:` expression.
              EXPECTED_TITLE="Implement $REPO#$N"

              # Operator review fix (eva#236): under a duplicate dispatch two
              # runs share this run-name (observed live 2026-07-24 on this
              # very issue's build: 30090789731 in_progress + 30090800237
              # pending). A fast claim-skip duplicate COMPLETES while the
              # older run keeps building — so "latest match is completed"
              # does NOT mean no build is live. ANY non-completed matching
              # run marks the claim live; only when every match is completed
              # may the latest one serve as the grace-window reference.
              LIVE_MATCH=$(jq --arg t "$EXPECTED_TITLE" \
                '([.[] | select(.displayTitle == $t and .status != "completed")] | sort_by(.createdAt) | last) // empty' \
                /tmp/eva-reaper-runs.json)
              if [ -n "$LIVE_MATCH" ]; then
                LSTATUS=$(printf '%s' "$LIVE_MATCH" | jq -r '.status')
                LURL=$(printf '%s' "$LIVE_MATCH" | jq -r '.url')
                echo "  $REPO#$N — backing run still $LSTATUS ($LURL), not a stall"
                TOTAL_LIVE=$(( TOTAL_LIVE + 1 )); continue
              fi

              MATCH=$(jq --arg t "$EXPECTED_TITLE" \
                '([.[] | select(.displayTitle == $t)] | sort_by(.createdAt) | last) // empty' \
                /tmp/eva-reaper-runs.json)

              RUN_NOTE=""
              if [ -n "$MATCH" ]; then
                # Every match is completed here (the LIVE_MATCH guard above
                # already bailed otherwise), so this is the latest FINISHED
                # attempt — the grace-window reference timestamp.
                MUPDATED=$(printf '%s' "$MATCH" | jq -r '.updatedAt')
                MURL=$(printf '%s' "$MATCH" | jq -r '.url')
                MCONCLUSION=$(printf '%s' "$MATCH" | jq -r '.conclusion')

                if [[ "$MUPDATED" > "$CUTOFF" ]]; then
                  echo "  $REPO#$N — backing run ended $MUPDATED (within the ${GRACE_MINUTES}m grace window), deferring to next sweep"
                  TOTAL_GRACE=$(( TOTAL_GRACE + 1 )); continue
                fi
                RUN_NOTE="the backing run ($MURL) ended with conclusion \`$MCONCLUSION\` without reaching either normal exit path"
              else
                # No matching run in the lookback window — fall back to the
                # issue's own most recent \`eva-implementing\` labeling event
                # (same timeline technique eva-queue.yml uses for approved-by
                # lookups) so a claim still can't be reaped before ITS OWN
                # grace window has elapsed.
                LABELED_AT=$(gh api "repos/$REPO/issues/$N/timeline" --paginate \
                  --jq '.[] | select(.event=="labeled" and .label.name=="eva-implementing") | .created_at' \
                  2>/dev/null | tail -n 1 || true)
                if [ -z "$LABELED_AT" ]; then
                  echo "  $REPO#$N — no matching run and no labeling event found, skipping (can't confirm this is stale)"
                  TOTAL_SKIPPED=$(( TOTAL_SKIPPED + 1 )); continue
                fi
                if [[ "$LABELED_AT" > "$CUTOFF" ]]; then
                  echo "  $REPO#$N — claimed $LABELED_AT (within the ${GRACE_MINUTES}m grace window), deferring to next sweep"
                  TOTAL_GRACE=$(( TOTAL_GRACE + 1 )); continue
                fi
                RUN_NOTE="no backing eva-implement run was found in the last 300 runs (predates this workflow, or fell out of the lookback window)"
              fi

              echo "  $REPO#$N — no live run backing the claim, grace window elapsed. $RUN_NOTE"

              if [ "$ACTIONS" -ge "$MAX_ACTIONS" ]; then
                echo "    action cap reached ($MAX_ACTIONS/run) — deferring to next sweep"
                TOTAL_SKIPPED=$(( TOTAL_SKIPPED + 1 )); continue
              fi

              # Same contract check as eva-implement.yml's own `Verify
              # implement contract`: an OPEN or MERGED, same-repo (non-fork)
              # eva-impl/* PR referencing #N means the build actually
              # succeeded — only the claim-release step didn't run. Left/
              # right-anchored so cross-repo "eva#42" prose can't false-match
              # and "#4" can't match "#42".
              PR_MATCH=$(jq --arg n "$N" \
                '[.[] | select((.state == "OPEN" or .state == "MERGED")
                               and (.isCrossRepository | not)
                               and (.headRefName | startswith("eva-impl/"))
                               and (((.title // "") + " " + (.body // "")) | test("(^|[^\\w#])#\($n)([^0-9]|$)")))]' \
                /tmp/eva-reaper-prs.json)
              PR_COUNT=$(printf '%s' "$PR_MATCH" | jq 'length')

              if [ "$LIVE" != "true" ]; then
                if [ "$PR_COUNT" -gt 0 ]; then
                  echo "    DRY RUN — would release eva-implementing only (a PR already closes this issue)"
                else
                  echo "    DRY RUN — would release eva-implementing and restore approved"
                fi
                ACTIONS=$(( ACTIONS + 1 )); continue
              fi

              ACTIONS=$(( ACTIONS + 1 ))

              if [ "$PR_COUNT" -gt 0 ]; then
                PR_URL=$(printf '%s' "$PR_MATCH" | jq -r '.[0].url')
                # Confirm the release itself lands before reporting success
                # (same confirm-before-success discipline as the restore
                # branch below) — a failed removal must fall back to
                # needs-operator, not silently claim resolution while the
                # claim label is still actually present.
                if gh issue edit "$N" --repo "$REPO" --remove-label eva-implementing; then
                  gh issue comment "$N" --repo "$REPO" --body \
                    "Eva's reaper (eva#231) found this issue's build already produced $PR_URL, but the \`eva-implementing\` claim was left in place — $RUN_NOTE (contract-verify skips on cancellation, eva#170). Released the stale claim; no further action needed, the PR speaks for itself." || true
                  echo "    released eva-implementing only (PR $PR_URL already closes this issue)"
                  TOTAL_RELEASED=$(( TOTAL_RELEASED + 1 ))
                else
                  gh label create needs-operator --repo "$REPO" \
                    --description "Pipeline blocked on the human operator to unblock" \
                    --color "e11d21" 2>/dev/null || true
                  gh issue edit "$N" --repo "$REPO" --add-label needs-operator 2>/dev/null || true
                  gh issue comment "$N" --repo "$REPO" --body \
                    "Eva's reaper (eva#231) found this issue's build already produced $PR_URL, but could not release the stale \`eva-implementing\` claim — flagged \`needs-operator\`. Operator: remove \`eva-implementing\` manually, the PR already covers this issue." || true
                  echo "    found PR $PR_URL, but releasing eva-implementing FAILED — flagged needs-operator"
                  TOTAL_NEEDS_OPERATOR=$(( TOTAL_NEEDS_OPERATOR + 1 ))
                fi
                continue
              fi

              # Confirm the restore actually lands before counting it a
              # success (mirrors eva-conflict-scan.yml's REQUEUED pattern) —
              # a failed removal OR a failed `--add-label approved` must fall
              # back to needs-operator, not silently report success while the
              # claim state is ambiguous.
              if gh issue edit "$N" --repo "$REPO" --remove-label eva-implementing \
                 && gh issue edit "$N" --repo "$REPO" --add-label approved; then
                gh issue comment "$N" --repo "$REPO" --body \
                  "Eva's reaper (eva#231) released a stale \`eva-implementing\` claim — $RUN_NOTE, and no open/merged PR closes this issue, so the pipeline was treating it as in-flight forever with no live build backing it. Restored \`approved\`; the next queue sweep will pick it up for a fresh build." || true
                echo "    released eva-implementing, restored approved"
                TOTAL_REQUEUED=$(( TOTAL_REQUEUED + 1 ))
              else
                gh label create needs-operator --repo "$REPO" \
                  --description "Pipeline blocked on the human operator to unblock" \
                  --color "e11d21" 2>/dev/null || true
                gh issue edit "$N" --repo "$REPO" --remove-label eva-implementing --add-label needs-operator 2>/dev/null || true
                gh issue comment "$N" --repo "$REPO" --body \
                  "Eva's reaper (eva#231) tried to release the stale \`eva-implementing\` claim ($RUN_NOTE) but a write failed partway — flagged \`needs-operator\`. Operator: confirm \`eva-implementing\` is removed and re-add \`approved\` manually to retry." || true
                echo "    releasing/restoring FAILED partway — flagged needs-operator"
                TOTAL_NEEDS_OPERATOR=$(( TOTAL_NEEDS_OPERATOR + 1 ))
              fi
            done
          done

          echo ""
          echo "Reaper digest: found=$TOTAL_FOUND live=$TOTAL_LIVE grace=$TOTAL_GRACE released_only=$TOTAL_RELEASED requeued=$TOTAL_REQUEUED needs_operator=$TOTAL_NEEDS_OPERATOR skipped=$TOTAL_SKIPPED (live=$LIVE, grace_window=${GRACE_MINUTES}m, cap=$MAX_ACTIONS)"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            printf 'Reaper (eva#231): found=%s live=%s grace=%s released_only=%s requeued=%s needs_operator=%s skipped=%s (live=%s)\n' \
              "$TOTAL_FOUND" "$TOTAL_LIVE" "$TOTAL_GRACE" "$TOTAL_RELEASED" "$TOTAL_REQUEUED" "$TOTAL_NEEDS_OPERATOR" "$TOTAL_SKIPPED" "$LIVE" >> "$GITHUB_STEP_SUMMARY"
          fi
